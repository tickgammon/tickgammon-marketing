<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Bricolage Grotesque';font-weight:800;src:url(../fridaycup/fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:700;src:url(../fridaycup/fonts/manrope-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:800;src:url(../fridaycup/fonts/manrope-latin-800-normal.woff2) format('woff2')}
html,body{margin:0;overflow:hidden;background:#0b1a33;font-family:Manrope,sans-serif;color:#fdfbf0}
#s{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#163a6b 0%,#0b1a33 70%)}
.a{position:absolute}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;box-sizing:border-box;flex-direction:column}
.txt{display:flex;flex-direction:column;flex:0 0 auto;align-items:center;text-align:center}
.kick{background:#d4a94a;color:#0b1a33;font-weight:800;letter-spacing:3px;text-transform:uppercase;border-radius:999px;padding:.35em .9em;font-size:20px}
.ttl{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;text-transform:uppercase;font-size:68px;line-height:.95;letter-spacing:-.03em;margin:.22em 0 .2em}
.ttl em,.sub em{font-style:normal;color:#e6c47c}
.sub{font-size:28px;font-weight:700;color:#dce8f5;line-height:1.3}
.vbox{flex:0 0 auto;position:relative;width:640px;height:600px}
.bf{font-family:'Bricolage Grotesque',sans-serif;font-weight:800}
.card{background:#fdfbf0;color:#0b1a33;border-radius:24px;box-shadow:0 12px 0 rgba(0,0,0,.3);box-sizing:border-box}
.btnff{display:inline-flex;align-items:center;gap:.45em;background:linear-gradient(#e6c47c,#c9a86a);color:#0b1a33;border-radius:16px;padding:.42em .9em;box-shadow:0 6px 0 #8a6a3a}
.cell{position:absolute;width:86px;height:86px;border-radius:16px;background:#123f30;box-shadow:inset 0 0 0 3px rgba(212,169,74,.6),0 6px 0 rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;color:#e6c47c}
.cell.r{background:#7a1f2b}
.ck{position:absolute;border-radius:50%;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.ck img{width:100%;height:100%;display:block}
.price{position:absolute;background:#d4a94a;color:#0b1a33;border-radius:999px;padding:6px 18px;font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;box-shadow:0 5px 0 #8a6a3a;white-space:nowrap}
#ia{position:absolute;left:18px;bottom:22px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:800;font-size:17px;border-radius:999px;padding:5px 14px;letter-spacing:.5px;z-index:9}
#ia{display:none!important} /* 07/11/2026 : jamais de mention IA à l'écran (règle Joyce) */
</style></head><body><div id="s">

<div style="position:absolute;left:11.9%;top:14.6%;width:76.2%;height:72.3%">

// ---------- textes ----------
const T={
avent:{
 fr:{a:['CHUT…','Demain, <em>la 1re case</em>…','Le calendrier de l’Avent de la chouette'],b:['DU 1ER AU 24 DÉCEMBRE','Une case <em>chaque jour</em>','Des TGC offerts et des objets d’hiver… 🤫'],o:['Dès <em>demain</em> !','Sur l’accueil','CALENDRIER','Sur le site, Android et Windows']},
 en:{a:['SHH…','Tomorrow, <em>the 1st door</em>…','The owl’s Advent calendar'],b:['DECEMBER 1 TO 24','One door <em>every day</em>','Free TGC and winter items… 🤫'],o:['Starting <em>tomorrow</em>!','On the home screen','ADVENT CALENDAR','On the website, Android and Windows']},
 es:{a:['CHIS…','Mañana, <em>la 1.ª casilla</em>…','El calendario de Adviento de la lechuza'],b:['DEL 1 AL 24 DE DICIEMBRE','Una casilla <em>cada día</em>','TGC de regalo y objetos de invierno… 🤫'],o:['¡Desde <em>mañana</em>!','En la pantalla de inicio','CALENDARIO','En la web, Android y Windows']}},
plateau:{
 fr:{a:['NOUVEAU','Le plateau <em>de Noël</em> est arrivé !'],b:['PLATEAU COMPLET','Nuit de Noël <em>& sapins dorés</em>','Ses décors sont exclusifs à ce plateau'],c:['PIONS D’HIVER','Pions hiver <em>& Sapin</em>','À l’unité, pour tous tes plateaux'],o:['En <em>boutique</em> !','Sur l’accueil','BOUTIQUE','Sur le site, Android et Windows'],pr:'2 500 TGC',pc:'500 TGC'},
 en:{a:['NEW','The <em>Christmas board</em> is here!'],b:['FULL BOARD','Christmas night <em>& golden trees</em>','Its decorations are exclusive to this board'],c:['WINTER CHECKERS','Winter <em>& Fir tree</em> checkers','Sold separately, for all your boards'],o:['Now in the <em>shop</em>!','On the home screen','SHOP','On the website, Android and Windows'],pr:'2,500 TGC',pc:'500 TGC'},
 es:{a:['NOVEDAD','¡Llegó el <em>tablero de Navidad</em>!'],b:['TABLERO COMPLETO','Noche de Navidad <em>y abetos dorados</em>','Su decoración es exclusiva de este tablero'],c:['FICHAS DE INVIERNO','Fichas Invierno <em>y Abeto</em>','Por separado, para todos tus tableros'],o:['¡Ya en la <em>tienda</em>!','En la pantalla de inicio','TIENDA','En la web, Android y Windows'],pr:'2.500 TGC',pc:'500 TGC'}},
noel:{
 fr:{a:['25 DÉCEMBRE','Joyeux <em>Noël</em> !','Toute l’équipe TickGammon te souhaite de belles fêtes'],b:['AUJOURD’HUI ENCORE','Ton bonus TGC <em>×2</em>','Le bouton 🎁 Bonus rapporte le double, les 24 et 25 décembre'],o:['Joyeuses <em>fêtes</em> 🎄','Sur l’accueil','BONUS ×2','Sur le site, Android et Windows']},
 en:{a:['DECEMBER 25','Merry <em>Christmas</em>!','The whole TickGammon team wishes you happy holidays'],b:['TODAY TOO','Your TGC bonus <em>×2</em>','The 🎁 Bonus button gives double, on December 24 and 25'],o:['Happy <em>holidays</em> 🎄','On the home screen','BONUS ×2','On the website, Android and Windows']},
 es:{a:['25 DE DICIEMBRE','¡Feliz <em>Navidad</em>!','Todo el equipo de TickGammon te desea felices fiestas'],b:['HOY TAMBIÉN','Tu bonus de TGC <em>×2</em>','El botón 🎁 Bonus da el doble, el 24 y el 25 de diciembre'],o:['Felices <em>fiestas</em> 🎄','En la pantalla de inicio','BONUS ×2','En la web, Android y Windows']}},
voeux:{
 fr:{a:['MERCI','Merci pour cette <em>1re année</em> !','Vous avez fait vivre TickGammon en 2026'],b:['31 DÉCEMBRE','Bonne année <em>2027</em> !'],o:['À 2027, <em>autour du plateau</em> 🎲','On se retrouve','JOUER','Sur le site, Android et Windows']},
 en:{a:['THANK YOU','Thanks for this <em>first year</em>!','You brought TickGammon to life in 2026'],b:['DECEMBER 31','Happy New Year <em>2027</em>!'],o:['See you in 2027, <em>around the board</em> 🎲','See you soon','PLAY','On the website, Android and Windows']},
 es:{a:['GRACIAS','¡Gracias por este <em>primer año</em>!','Disteis vida a TickGammon en 2026'],b:['31 DE DICIEMBRE','¡Feliz Año <em>2027</em>!'],o:['Nos vemos en 2027, <em>alrededor del tablero</em> 🎲','Hasta pronto','JUGAR','En la web, Android y Windows']}}
}[VID][L];
// ---------- visuels (640 x 600) ----------
function advent(){let s='';const n=[7,1,15,22,3,18,11,24,5,13,20,9,2,16,23,8,12,4,19,14,6,21,10,17];
 for(let i=0;i<24;i++){const c=i%4,r=Math.floor(i/4);s+=`<div class="cell${(i*7)%5===0?' r':''}" data-n="${n[i]}" style="left:${132+c*98}px;top:${18+r*96}px">${n[i]}</div>`;}
 return s;}
function board(){return `<div class="a brd" style="left:-40px;top:110px;width:720px;height:405px;border-radius:20px;overflow:hidden;box-shadow:0 18px 0 rgba(0,0,0,.35),0 0 60px rgba(230,196,124,.35)"><img src="img/plateau_noel.png" style="width:100%;height:100%;display:block"></div>`;}
function checkers(){return `<div class="ck c1" style="left:70px;top:150px;width:240px;height:240px"><img src="img/checker_skin_pions_hiver.png"></div>
 <div class="ck c2" style="left:330px;top:150px;width:240px;height:240px"><img src="img/checker_skin_sapin.png"></div>
 <div class="price p1" style="left:110px;top:420px">${T.pc}</div><div class="price p2" style="left:370px;top:420px">${T.pc}</div>`;}
function bonus(){return `<div class="a card bx" style="left:120px;top:110px;width:400px;height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
 <div style="font-size:120px;line-height:1">🎁</div><div class="bf x2" style="font-size:130px;line-height:1;color:#c62f3a">×2</div><div class="bf" style="font-size:30px;letter-spacing:2px;color:#8a6a3a">TGC</div></div>`;}
function year(){return `<div class="a bf yr" style="left:0;width:640px;top:150px;text-align:center;font-size:230px;line-height:1;color:#e6c47c;text-shadow:0 10px 0 rgba(0,0,0,.35)"><span class="y6">2026</span><span class="y7" style="position:absolute;left:0;right:0;top:0">2027</span></div>
 <div class="a" style="left:0;width:640px;top:440px;text-align:center;font-size:80px">🥂</div>`;}
// ---------- scènes ----------
const scenes=[];
function scene(s,e,txt,vis,kind,o={}){const d=document.createElement('div');d.className='scene';
 d.innerHTML=(o.visFirst?'':`<div class="txt">${txt}</div>`)+(vis?`<div class="vbox" style="height:${o.vh||600}px"><div class="vis in" data-d=".1" style="position:absolute;inset:0">${vis}</div></div>`:'')+(o.visFirst?`<div class="txt">${txt}</div>`:'');
 $('#scenes').appendChild(d);d.style.gap='30px';d.style.padding='96px 40px 60px';
 d.querySelector('.txt').style.maxWidth=(LY.W-80)+'px';
 if(o.tfk)d.querySelectorAll('.ttl').forEach(t=>t.style.fontSize=(68*o.tfk)+'px');
 scenes.push({el:d,s,e,kind,ins:[...d.querySelectorAll('.in')]});}
const K=(k,d='.05')=>`<div class="kick in" data-d="${d}">${k}</div>`;
const TT=(t,d='.2')=>`<div class="ttl in" data-d="${d}">${t}</div>`;
const SB=(t,d='.45')=>t?`<div class="sub in" data-d="${d}">${t}</div>`:'';
const ICON={avent:'🎁',plateau:'🛍️',noel:'🎁',voeux:'🎲'}[VID];
function outro(s,e,o){const card=`<div class="card in" data-d=".6" style="text-align:center;padding:22px 30px;margin-top:10px;width:470px">
 <div style="font-weight:800;letter-spacing:3px;font-size:17px;color:#8a6a3a;text-transform:uppercase">${o[1]}</div>
 <div class="btnff bf" style="font-size:32px;margin:.35em 0 .1em"><span>${ICON}</span><span>${o[2]}</span></div>
 <div style="border-top:3px dashed #d8ceb0;margin:.7em 0"></div>
 <div class="cta bf" style="display:inline-block;background:#0b1a33;color:#e6c47c;border-radius:999px;padding:.35em 1em;font-size:29px">tickgammon.com →</div></div>`;
 scene(s,e,`${TT(o[0],'.3')}${card}${SB(o[3],'1.0')}`,VID==='noel'?OWLHAT:LOGOV(VID==='voeux'?`<div class="a" style="left:300px;top:-20px;font-size:110px;transform:rotate(12deg)">🥂</div>`:''),'outro',{visFirst:true,vh:500,tfk:.8});}
let END;
if(VID==='avent'){END=13;
 scene(0,5,`${K(T.a[0])}${TT(T.a[1],'.3')}${SB(T.a[2],'.7')}`,advent(),'adv1',{tfk:.95});
 scene(5,8.6,`${K(T.b[0])}${TT(T.b[1])}${SB(T.b[2])}`,advent(),'adv2',{tfk:.95});
 outro(8.6,END+1,T.o);}
if(VID==='plateau'){END=18;
 scene(0,4.2,`${K(T.a[0],'.3')}${TT(T.a[1],'.5')}`,board(),'brd1',{tfk:1});
 scene(4.2,9.2,`${K(T.b[0])}${TT(T.b[1])}${SB(T.b[2])}`,board()+`<div class="price pb" style="left:220px;top:540px;font-size:40px">${T.pr}</div>`,'brd2',{tfk:.85});
 scene(9.2,13.6,`${K(T.c[0])}${TT(T.c[1])}${SB(T.c[2])}`,checkers(),'cks',{tfk:.9});
 outro(13.6,END+1,T.o);}
if(VID==='noel'){END=14;
 scene(0,5,`${K(T.a[0],'.3')}${TT(T.a[1],'.5')}${SB(T.a[2],'.9')}`,OWLHAT,'owl',{visFirst:true,vh:520,tfk:1.15});
 scene(5,9.5,`${K(T.b[0])}${TT(T.b[1])}${SB(T.b[2])}`,bonus(),'bonus',{tfk:.95});
 outro(9.5,END+1,T.o);}
if(VID==='voeux'){END=15;
 scene(0,5,`${K(T.a[0],'.3')}${TT(T.a[1],'.5')}${SB(T.a[2],'.9')}`,LOGOV(),'owl',{visFirst:true,vh:520,tfk:1});
 scene(5,10,`${K(T.b[0])}${TT(T.b[1],'2.0')}`,year(),'year',{tfk:1});
 outro(10,END+1,T.o);}
// neige + confettis
const SNOW=[],CONF=[];(function(){let seed=13;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
 for(let i=0;i<70;i++){const d=document.createElement('div');d.className='a';const w=3+r()*7;d.style.cssText=`width:${w}px;height:${w}px;border-radius:50%;background:#fff;opacity:${.35+r()*.5}`;$('#snow').appendChild(d);SNOW.push({d,x:r()*LY.W,y:r()*LY.H,v:30+r()*70,sw:10+r()*25,ph:r()*6});}
 const cols=['#d4a94a','#c62f3a','#fdfbf0','#2f9a64'];
 for(let i=0;i<50;i++){const d=document.createElement('div');d.className='a';const w=9+r()*11;d.style.cssText=`width:${w}px;height:${w*.5}px;background:${cols[i%4]};border-radius:2px`;$('#conf').appendChild(d);CONF.push({d,x:r()*LY.W,v:150+r()*200,r:r()*360,vr:(r()-.5)*500,sw:r()*30,ph:r()*6});}})();
// ---------- animation ----------
const cl=x=>Math.max(0,Math.min(1,x)),seg=(t,a,b)=>cl((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function wink(el,on){el.querySelectorAll('.eyeW').forEach(x=>x.style.opacity=on?1:0);}
function wave(el,lt,a,b){const e=Math.min(seg(lt,a,a+.3),1-seg(lt,b-.3,b));const ang=e*(52+22*Math.sin((lt-a)*Math.PI*4.4));el.querySelectorAll('.wingI').forEach(w=>w.style.transform=`rotate(${-ang}deg)`);}
function render(t){
 $('#prog').style.width=(t/END*100)+'%';
 const sOut=scenes.find(x=>x.kind==='outro');
 $('#url').style.opacity=(t>scenes[0].e-0.01&&t<sOut.s)?1:0;
 SNOW.forEach(f=>{const y=(f.y+f.v*t)%(LY.H+20)-10;f.d.style.transform=`translate(${f.x+Math.sin(t*1.2+f.ph)*f.sw}px,${y}px)`;});
 scenes.forEach(sc=>{const lt=t-sc.s,dur=sc.e-sc.s,on=t>=sc.s&&t<sc.e;
  if(!on){sc.el.style.opacity=0;return;}
  const out=sc.kind==='outro'?0:seg(lt,dur-.3,dur);sc.el.style.opacity=Math.min(seg(lt,0,.2),1-out);sc.el.style.transform=`translateX(${-out*60}px)`;
  sc.ins.forEach(e=>{const p=seg(lt,+e.dataset.d,+e.dataset.d+.5);e.style.opacity=eo(p);e.style.transform=`translateY(${(1-back(p))*40}px) scale(${.85+.15*back(p)})`;});
  const E=sc.el;
  if(sc.kind==='adv1'){E.querySelectorAll('.cell').forEach(c=>{const one=c.dataset.n==='1';c.style.transform=one?`scale(${1.12+.08*Math.sin(lt*6)}) rotate(${Math.sin(lt*14)*4*seg(lt,1.2,1.6)}deg)`:'scale(1)';c.style.opacity=one?1:.55;if(one)c.style.boxShadow=`inset 0 0 0 4px #e6c47c,0 0 ${30+20*Math.sin(lt*5)}px rgba(230,196,124,.9)`;});}
  if(sc.kind==='adv2'){E.querySelectorAll('.cell').forEach(c=>{const n=+c.dataset.n,p=seg(lt,.3+n*.11,.55+n*.11);c.style.transform=`rotateY(${p*180}deg)`;c.textContent=p>.5?(n%3===0?'❄️':(n%3===1?'🎁':'❓')):n;if(p>.5)c.style.transform=`rotateY(${(1-p)*180}deg)`;});}
  if(sc.kind==='brd1'){const b=E.querySelector('.brd');const p=eo(seg(lt,.2,1.2));b.style.transform=`perspective(900px) rotateX(${(1-p)*35}deg) scale(${.7+.3*p})`;}
  if(sc.kind==='brd2'){const b=E.querySelector('.brd');b.style.transform=`scale(${1+.12*eo(seg(lt,.3,4.5))})`;b.style.transformOrigin='50% 50%';const pb=E.querySelector('.pb');pb.style.transform=`scale(${eo(seg(lt,1.4,1.9))})`;}
  if(sc.kind==='cks'){[['.c1',.3],['.c2',.8]].forEach(([q,a])=>{const c=E.querySelector(q);const p=back(seg(lt,a,a+.6));c.style.transform=`translateY(${(1-p)*-300}px) rotate(${(1-p)*-180+Math.sin(lt*2)*4}deg)`;});
   [['.p1',1.3],['.p2',1.6]].forEach(([q,a])=>{E.querySelector(q).style.transform=`scale(${eo(seg(lt,a,a+.4))})`;});}
  if(sc.kind==='owl'){wave(E,lt,1.2,3.4);wink(E,lt>2.0&&lt<2.35);const h=E.querySelector('.hat');if(h)h.style.transform=`rotate(${-8+Math.sin(lt*3)*4}deg)`;}
  if(sc.kind==='bonus'){E.querySelector('.x2').style.transform=`scale(${1+.12*Math.max(0,Math.sin(lt*5))})`;}
  if(sc.kind==='year'){const p=eo(seg(lt,.8,1.6));E.querySelector('.y6').style.cssText=`display:inline-block;opacity:${1-p};transform:translateY(${-p*120}px)`;E.querySelector('.y7').style.cssText=`position:absolute;left:0;right:0;top:0;opacity:${p};transform:translateY(${(1-p)*120}px) scale(${1+.04*Math.sin(lt*4)})`;}
  if(sc.kind==='outro'){wave(E,lt,.6,2.8);wink(E,(lt>1.3&&lt<1.65)||(lt>3.2&&lt<3.5));const c=E.querySelector('.cta');if(c)c.style.transform=`scale(${1+.04*Math.sin(Math.max(0,lt-1.2)*5)})`;const h=E.querySelector('.hat');if(h)h.style.transform=`rotate(${-8+Math.sin(lt*3)*4}deg)`;}
 });
 const yr=scenes.find(x=>x.kind==='year');
 const ct=(yr&&t>=yr.s+1.5&&t<yr.e)?t-yr.s-1.5:(sOut&&t>=sOut.s+.1&&VID!=='avent'?t-sOut.s-.1:-1);
 CONF.forEach(c=>{if(ct<0||ct>5){c.d.style.opacity=0;return;}c.d.style.opacity=1;c.d.style.transform=`translate(${c.x+Math.sin(ct*2+c.ph)*c.sw}px,${-30+c.v*ct*(LY.H/900)}px) rotate(${c.r+c.vr*ct}deg)`;});
}
