<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:24px 34px 22px">
<div style="display:flex;flex-direction:column;gap:4px;min-width:0">
<div id="lWin" class="lab"></div>
<div id="winner2" class="val"></div>

</div>
<div style="display:flex;flex-direction:column;gap:4px;border-left:2px solid #e6dcc3;padding-left:20px;min-width:0">

<div id="finalist" class="val"></div>
<div class="sub">400 TGC</div>
</div>
<div style="display:flex;flex-direction:column;gap:4px;border-left:2px solid #e6dcc3;padding-left:20px;min-width:0">
<div id="lNext" class="lab"></div>
<div id="next" class="val"></div>

</div>
</div>
<div style="position:relative;height:0;margin:0 30px;border-top:3px dashed #d8c9a5">
<div style="position:absolute;left:-52px;top:-23px;width:44px;height:44px;border-radius:50%;background:#0d3326"></div>

<div id="module" style="font-size:17px;font-weight:600;color:#4b5d53"></div>

<svg style="width:22px;height:22px" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12 H19 M13 6 L19 12 L13 18" fill="none" stroke="#c9a86a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>

<script>
const T = {
 fr:{edition:'Édition',champ:'Champion',week:'de la semaine',offered:'TGC offerts au vainqueur',clan:'par le clan TickGammon',lWin:'Vainqueur',lFin:'Finaliste',lNext:'Prochaine',next:'Vendredi',nextSub:'21h, heure de Paris',cta:'Bravo à tous les joueurs !',module:'Module Events'},
 en:{edition:'Edition',champ:'Champion',week:'of the week',offered:'TGC offered to the winner',clan:'by the TickGammon clan',lWin:'Winner',lFin:'Runner-up',lNext:'Next one',next:'Friday',nextSub:'9 pm, Paris time',cta:'Well played, everyone!',module:'Events module'},
 es:{edition:'Edición',champ:'Campeón',week:'de la semana',offered:'TGC ofrecidos al ganador',clan:'por el clan TickGammon',lWin:'Ganador',lFin:'Finalista',lNext:'Próxima',next:'Viernes',nextSub:'21h, hora de París',cta:'¡Bravo a todos los jugadores!',module:'Módulo Events'}
};
function fill(D){
 const t = T[D.lang] || T.fr;
 const set = (id, v) => { document.getElementById(id).textContent = v; };
 set('tEdition', t.edition); set('edition', D.edition);
 set('tChamp', t.champ); set('tWeek', t.week); set('tOffered', t.offered); set('tClan', t.clan);
 set('lWin', t.lWin); set('lFin', t.lFin); set('lNext', t.lNext); set('next', t.next); set('nextSub', t.nextSub);
 set('cta', t.cta); set('module', t.module);
 set('winner', D.winner); set('winner2', D.winner); set('finalist', D.finalist);
 // Pseudo long : on réduit la taille jusqu'à ce qu'il tienne dans sa colonne
 const w = document.getElementById('winner'); let fs = 130;
 while (w.scrollWidth > w.parentElement.clientWidth && fs > 40) { fs -= 4; w.style.fontSize = fs + 'px'; w.style.letterSpacing = (-fs / 32) + 'px'; }
 // Même chose pour les pseudos du ticket (34 px au départ)
 document.querySelectorAll('.val').forEach(el => { let f = 34; el.style.textOverflow = 'clip';
  while (el.scrollWidth > el.clientWidth && f > 18) { f -= 2; el.style.fontSize = f + 'px'; } });
}
if (window.DATA) fill(window.DATA);
</script>

</html>
