 const r=pw/2-3;
 st.forEach(([c,top,n,col],k)=>{const xl=x0+20+(c>=6?bw:0)+c*pw+pw/2;for(let j=0;j<n;j++){const y=top?y0+14+r+2+j*(2*r+1):y0+H-14-r-2-j*(2*r+1);
  s+=`<g class="pc" data-k="${k*6+j}"><circle cx="${xl}" cy="${y}" r="${r}" fill="${col==='w'?'#f6efe0':'#1d1a17'}" stroke="${col==='w'?'#c9b48a':'#000'}" stroke-width="2"/><circle cx="${xl}" cy="${y}" r="${r*.55}" fill="none" stroke="${col==='w'?'#d9c79f':'#3a332c'}" stroke-width="2"/></g>`;}});

if(VID==='cover'){END=1;const d=document.createElement('div');d.className='scene';d.style.opacity=1;
 d.innerHTML=`<div class="a" style="left:70px;top:150px;width:420px;height:420px">${LOGO}</div>
 <div class="a" style="left:560px;top:150px;width:640px;height:560px;transform:scale(1.08);transform-origin:0 0">${board()}</div>
 <div class="a" style="left:70px;top:40px;width:1140px;text-align:left"><div class="ttl" style="font-size:66px;margin:0">${T.t}</div><div class="sub" style="font-size:28px">${T.s}</div></div>`;
 $('#scenes').appendChild(d);$('#url').style.display='none';$('#prog').style.display='none';scenes.push({el:d,s:0,e:9,kind:'cover',ins:[]});}
// confettis
const CONF=[];(function(){let seed=11;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};const cols=['#ff7a59','#c9a86a','#fdfbf0','#e0c27a'];
 for(let i=0;i<46;i++){const d=document.createElement('div');d.className='a';const w=9+r()*11;d.style.cssText=`width:${w}px;height:${w*.5}px;background:${cols[i%4]};border-radius:2px`;$('#conf').appendChild(d);CONF.push({d,x:r()*LY.W,v:150+r()*200,r:r()*360,vr:(r()-.5)*400,ph:r()*6,sw:10+r()*30});}})();
// ---------- animation ----------
const cl=x=>Math.max(0,Math.min(1,x)),seg=(t,a,b)=>cl((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function wink(el,on){el.querySelectorAll('.eyeW').forEach(x=>{x.style.opacity=on?1:0;});}
function wave(el,lt,a,b){const e=Math.min(seg(lt,a,a+.3),1-seg(lt,b-.3,b));const ang=e*(52+22*Math.sin((lt-a)*Math.PI*2*2.2));el.querySelectorAll('.wingI').forEach(w=>w.style.transform=`rotate(${-ang}deg)`);}
const OUTK=['outro','outroT'];
function render(t){
 $('#prog').style.width=(t/END*100)+'%';
 const sOut=scenes.find(x=>OUTK.includes(x.kind));
 $('#url').style.opacity=(t>(scenes[1]?scenes[1].s:0)&&(!sOut||t<sOut.s))?1:0;
 let fl=0;
 scenes.forEach(sc=>{const lt=t-sc.s,dur=sc.e-sc.s,on=t>=sc.s&&t<sc.e;
  if(sc.kind==='cover')return;if(!on){sc.el.style.opacity=0;return;}
  const out=OUTK.includes(sc.kind)?0:seg(lt,dur-.3,dur);sc.el.style.opacity=Math.min(seg(lt,0,.2),1-out);sc.el.style.transform=`translateX(${-out*60}px)`;
  sc.ins.forEach(e=>{const p=seg(lt,+e.dataset.d,+e.dataset.d+.5);e.style.opacity=eo(p);e.style.transform=(e.dataset.sc?`scale(${e.dataset.sc}) `:'')+`translateY(${(1-back(p))*40}px) scale(${.85+.15*back(p)})`;});
  const E=sc.el;
  if(sc.kind==='intro'){wave(E,lt,.9,2.9);wink(E,lt>1.6&&lt<1.95);}
  if(OUTK.includes(sc.kind)){wave(E,lt,.6,2.8);wink(E,(lt>1.3&&lt<1.65)||(lt>3.6&&lt<3.9));const c=E.querySelector('.cta');if(c)c.style.transform=`scale(${1+.04*Math.sin(Math.max(0,lt-1.2)*5)})`;}
  if(sc.kind==='photo'||sc.kind==='tphoto'){const sh=E.querySelector('.shut');const p=seg(lt,1.8,2.1);sh.style.transform=`scale(${lt>1.8&&lt<2.1?.82:1})`;if(lt>2.0&&lt<2.6)fl=Math.max(fl,1-seg(lt,2.0,2.6));
   E.querySelector('.ph').style.transform=`rotate(${-3+3*eo(seg(lt,0,1.5))}deg) translateY(${(1-eo(seg(lt,0,1.2)))*40}px)`;}
  if(sc.kind==='scan'){const y=84+ (390)*((lt*0.55)%1);E.querySelector('.scl').style.top=y+'px';E.querySelector('.scl').style.opacity=lt<3?1:0;
   E.querySelectorAll('.pc').forEach(g=>{const k=+g.dataset.k;const p=seg(lt,.3+(k%60)*.035,.6+(k%60)*.035);g.style.opacity=.35+.65*p;});
   const ok=E.querySelector('.okb');const p=seg(lt,2.9,3.3);ok.style.opacity=eo(p);ok.style.transform=`scale(${.8+.2*back(p)})`;}
  if(sc.kind==='moves'){E.querySelectorAll('.mi').forEach(m=>{const i=+m.dataset.i;const p=seg(lt,.5+i*.35,.9+i*.35);m.style.opacity=.1+.9*eo(p);m.style.transform=`translateX(${(1-eo(p))*30}px)`;m.querySelector('i').style.transform=`scaleX(${eo(p)})`;m.querySelector('i').style.transformOrigin='0 50%';});wave(E,lt,1.8,3.6);}
  if(sc.kind==='checks'){E.querySelectorAll('.ci').forEach(c=>{const p=seg(lt,.5+(+c.dataset.i)*.4,.85+(+c.dataset.i)*.4);c.style.opacity=.15+.85*eo(p);c.style.transform=`translateX(${(1-eo(p))*30}px)`;});}
  if(sc.kind==='eye'){const o=eo(seg(lt,.8,2.4));E.querySelector('.lidT').style.transform=`translateY(${-o*220}px)`;E.querySelector('.lidB').style.transform=`translateY(${o*220}px)`;
   const q=E.querySelector('.qm');q.style.opacity=seg(lt,2.4,2.9);q.style.transform=`scale(${1+.08*Math.sin(lt*4)})`;}
 });
 $('#flash').style.opacity=fl*.85;
 const ct=(scenes[0].kind==='intro'&&t<3)?t-.3:(sOut&&t>=sOut.s+.1?t-sOut.s-.1:-1);
 CONF.forEach(c=>{if(ct<0||ct>5){c.d.style.opacity=0;return;}c.d.style.opacity=1;c.d.style.transform=`translate(${c.x+Math.sin(ct*2+c.ph)*c.sw}px,${-30+c.v*ct*(LY.H/900)}px) rotate(${c.r+c.vr*ct}deg)`;});
}
window.render=render;window.END=END;render(0);
</script></body></html>
