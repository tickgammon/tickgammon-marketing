<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));

<img id="wing" src="owl_wing.png" style="position:absolute;inset:0;width:100%;height:100%;transform-origin:70.8% 53.5%"></div>`;
const G='#e1b553';

 dice:SV('<rect x="7" y="7" width="34" height="34" rx="8"/><circle cx="17" cy="17" r="2.5" fill="#e1b553"/><circle cx="31" cy="31" r="2.5" fill="#e1b553"/><circle cx="24" cy="24" r="2.5" fill="#e1b553"/>'),

 <div style="width:${w*.1}px;height:46px;margin:0 auto;background:linear-gradient(90deg,#555,#888,#555)"></div><div style="width:${w*.42}px;height:10px;margin:0 auto;border-radius:6px;background:#777"></div></div>`;

const PT=[...Array(46)].map((_,i)=>({x:(i*137.5)%1280,y:(i*91.3)%720,r:1+(i%4)*.8,v:6+(i%7)*3,ph:i*1.7}));

const PRT=[25.3,26.2,26.95,27.4,28.6], PRL=[['chart','Classement ELO'],['medal','Palmarès'],['people','Amis'],['shield','Club'],['star','Succès']];

const on=(T,t0,t1)=>Math.min(seg(T,t0,t0+.25),1-seg(T,t1,t1+.25));
function render(t){
 const V=D.voice,T=t-V;let ov='';

 $('#sweep').style.background=`linear-gradient(105deg,transparent ${sx/12.8}%,rgba(255,236,170,.06) ${(sx+160)/12.8}%,transparent ${(sx+320)/12.8}%)`;

 // ── A : 3 appareils, drapeaux, inscription gratuite (T -1 → 11,7)

 if(aA>0){const e=[0.2,0.45,0.7].map(d=>back(seg(t,d,d+.7)));

  [['globe','Navigateur',4.6,560],['mobile','Android',5.45,1000],['pc','Windows',6.3,170]].forEach(([ic,lb,t0,cx])=>{const a=seg(T,t0,t0+.35)*aA;if(a<=0)return;
   ov+=`<div class="a" style="left:${cx-80}px;top:${535+(1-eo(a))*20}px;width:190px;display:flex;justify-content:center;opacity:${a}"><div style="display:flex;gap:10px;align-items:center;padding:8px 18px;border-radius:999px;background:rgba(6,30,21,.85);border:2px solid ${G}">${IC[ic]}<span style="font-size:22px;font-weight:800">${lb}</span></div></div>`;});

  const sg=seg(T,9.7,10.15);if(sg>0)ov+=`<div class="a" style="left:390px;top:270px;width:500px;display:flex;justify-content:center;opacity:${Math.min(1,sg*1.5)*aA};transform:rotate(-7deg) scale(${2.2-1.2*eo(sg)})"><div class="bf" style="font-size:44px;letter-spacing:1px;color:#0b2e22;background:linear-gradient(180deg,#fbe39a,#e1b553 55%,#c4952f);padding:14px 30px;border-radius:18px;border:4px solid #fdfbf0;box-shadow:0 20px 50px rgba(0,0,0,.6)">INSCRIPTION GRATUITE</div></div>`;

  const tp=seg(T,22.2,22.9);if(tp>0&&tp<1)ov+=`<div class="a" style="left:${640-20-tp*70}px;top:${300-20-tp*70}px;width:${40+tp*140}px;height:${40+tp*140}px;border-radius:50%;border:5px solid #f6cf62;opacity:${1-tp}"></div>`;

 const aF=seg(T,36.0,36.6);
 if(aF>0){ov+=`<div class="a" style="inset:0;background:rgba(5,22,16,${.5*aF})"></div>`;
  const imp=seg(T,38.4,38.9), sh=T>38.4&&T<38.9?(1-imp)*10:0;

  ov+=`<div class="a" style="left:${560+sx_}px;top:${180+sy_}px;width:700px">

   <div class="bf" style="font-size:78px;line-height:1;margin-top:26px;opacity:${seg(T,37.6,37.95)};transform:translateY(${(1-eo(seg(T,37.6,38)))*24}px)">C'est vous,</div>

  if(T>38.4){const r=seg(T,38.4,39.6);ov+=`<div class="a" style="left:${800-r*700}px;top:${330-r*700}px;width:${r*1400}px;height:${r*1400}px;border-radius:50%;border:${8*(1-r)}px solid rgba(246,207,98,${.8*(1-r)})"></div>`;
   for(let i=0;i<24;i++){const ang=i*2*Math.PI/24+i*.3,d=eo(r)*(220+(i%5)*70);ov+=`<div class="a" style="left:${800+Math.cos(ang)*d}px;top:${330+Math.sin(ang)*d}px;width:7px;height:7px;border-radius:50%;background:#f6cf62;opacity:${1-r}"></div>`;}}}

 // ── chouette : entre à gauche (B), reste pendant C-D-E, se recentre en F
 let ox,oy,os=.8;const fl=seg(T,11.4,12.5),fe=eio(fl);
 ox=-460+500*fe; oy=230+Math.sin(fl*Math.PI)*-60;
 if(T>30.1){ox=40-40*eio(seg(T,30.1,30.8));}

 if(!flying&&T>38.4&&T<40){const e=Math.min(seg(T,38.4,38.7),1-seg(T,39.7,40));wing=e*(52+22*Math.sin((T-38.4)*Math.PI*4));}
 $('#wing').style.transform=`rotate(${-wing}deg)`;
