<style>

.btnff{display:inline-flex;align-items:center;gap:.45em;background:linear-gradient(#e6c47c,#c9a86a);color:#0d3326;border-radius:16px;padding:.42em .9em;box-shadow:0 6px 0 #8a6a3a}

// ---------- visuels (640 x 560) ----------
const SCR={x:100,y:156.25,w:440,h:247.5};
function person(shirt,hair){return `<g>

 const z=o.zoom?`data-zoom="${o.zoom.join(',')}"`:'';

 <svg class="a" viewBox="0 0 640 560" width="640" height="560" style="left:0;top:0"><g transform="translate(560 96)"><circle r="40" fill="#fdfbf0"/><circle r="27" fill="#f3ead2"/><circle r="20" fill="#4a2b16"/><rect x="24" y="-8" width="22" height="16" rx="8" fill="#fdfbf0"/></g>
  <g transform="translate(78 470) rotate(-14)"><rect x="-24" y="-24" width="48" height="48" rx="10" fill="#fdfbf0"/><circle cx="-11" cy="-11" r="5" fill="#0d3326"/><circle cx="11" cy="11" r="5" fill="#0d3326"/><circle r="5" fill="#0d3326"/></g></svg>
 <div class="a" style="left:${SCR.x-16}px;top:${SCR.y-16}px;width:${SCR.w+32}px;height:${SCR.h+32}px;border-radius:26px;background:#18191b;box-shadow:0 18px 30px rgba(0,0,0,.45),inset 0 0 0 2px #3a3b3e"></div>
 <div class="a scr" style="left:${SCR.x}px;top:${SCR.y}px;width:${SCR.w}px;height:${SCR.h}px;border-radius:6px;overflow:hidden;${o.blur?`filter:blur(${o.blur}px);`:''}"><img src="${CAP+CAPS[cap]}" style="width:100%;height:100%;display:block"></div>
 <svg class="a" viewBox="0 0 640 560" width="640" height="560" style="left:0;top:0;overflow:visible">${person('#ff7a59','#3b2a1e')}<g transform="rotate(180 320 280)">${person('#2f7a57','#7a4a24')}</g></svg>
 ${o.names!==false?`<div class="a bf" style="left:420px;top:500px;background:#fdfbf0;color:#0d3326;border-radius:999px;padding:4px 14px;font-size:20px">Nadine</div><div class="a bf" style="left:150px;top:30px;background:#fdfbf0;color:#0d3326;border-radius:999px;padding:4px 14px;font-size:20px;transform:rotate(180deg)">Guy</div>`:''}
 ${o.q?`<div class="a bf qm" style="left:${SCR.x}px;top:${SCR.y}px;width:${SCR.w}px;height:${SCR.h}px;display:flex;align-items:center;justify-content:center;font-size:170px;color:#fdfbf0;text-shadow:0 8px 0 rgba(0,0,0,.35)">?</div>`:''}
 </div></div>`;}

 cafe:`<svg viewBox="0 0 100 100" width="96" height="96"><path d="M40 12 Q34 20 40 28 M52 10 Q46 18 52 26" stroke="#d9e6dc" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M20 36 H70 V58 Q70 78 45 78 Q20 78 20 58 Z" fill="#fdfbf0"/><path d="M70 42 Q86 42 84 54 Q82 64 69 62" stroke="#fdfbf0" stroke-width="6" fill="none"/><ellipse cx="45" cy="84" rx="34" ry="6" fill="#c9a86a"/></svg>`,

 <div class="a thx" style="left:20px;top:330px;width:600px;display:flex;align-items:center;gap:22px;background:#123f30;border-radius:24px;padding:20px 26px;box-sizing:border-box;box-shadow:inset 0 0 0 3px #c9a86a">

// ---------- scènes ----------
const scenes=[];
function scene(s,e,txt,vis,kind,opt={}){const d=document.createElement('div');d.className='scene';
 const sc=opt.sc||Math.min(LY.vbW/640,LY.vbH/560);const w=640*sc,h=(opt.vh||560)*sc;
 d.innerHTML=(opt.visFirst?'':`<div class="txt">${txt}</div>`)+(vis?`<div class="vbox" style="width:${w}px;height:${h}px;${opt.clip?'overflow:hidden;border-radius:'+(24*sc)+'px;':''}"><div class="vis in" data-d=".1" data-sc="${sc}">${vis}</div></div>`:'')+(opt.visFirst?`<div class="txt">${txt}</div>`:'');
 $('#scenes').appendChild(d);
 d.style.flexDirection=LY.dir;d.style.gap=LY.gap+'px';d.style.padding=LY.padT+'px '+LY.pad+'px '+LY.pad+'px';
 const tx=d.querySelector('.txt');tx.style.textAlign=LY.dir==='row'?'left':'center';tx.style.alignItems=LY.dir==='row'?'flex-start':'center';
 if(LY.dir==='row')tx.style.width=(LY.W-w-LY.gap-2*LY.pad)+'px';else tx.style.maxWidth=(LY.W-2*LY.pad)+'px';
 if(opt.tfk)tx.querySelectorAll('.ttl').forEach(t=>t.style.fontSize=`calc(var(--tf)*${opt.tfk})`);
 scenes.push({el:d,s,e,kind,ins:[...d.querySelectorAll('.in')]});return d;}
const K=(k,d='.05')=>`<div class="kick in" data-d="${d}">${k}</div>`;
const TT=(t,d='.2')=>`<div class="ttl in" data-d="${d}">${t}</div>`;

 <div class="btnff bf" style="font-size:calc(var(--sf)*1.15);margin:.35em 0 .1em">${ICO()}<span>${o[2]}</span></div>
 <div style="border-top:3px dashed #d8ceb0;margin:.7em 0"></div>
 <div class="cta bf" style="display:inline-block;background:#0d3326;color:#c9a86a;border-radius:999px;padding:.35em 1em;font-size:calc(var(--sf)*1.05)">tickgammon.com →</div></div>`;

 scene(8.4,12.6,`${K(T.s3[0])}${TT(T.s3[1])}${SB(T.s3[2])}`,table({cap:3,zoom:[.5,.76,3]}),'zoom',{clip:true,tfk:.85});
 scene(12.6,16.4,`${K(T.s4[0])}${TT(T.s4[1])}`,checks(T.checks),'checks');
 scene(16.4,19.6,`${K(T.s5[0])}${TT(T.s5[1])}`,places(T.places,T.s5[2]),'places',{tfk:.85});
 outro(19.6,END+1,T.out);
}
if(VID==='teaser'){END=9.5;
 scene(0,5,`${K(T.s1[0])}${TT(T.s1[1],'.3')}`,table({cap:1,blur:7,q:true,names:false}),'tease',{clip:true,tfk:.85});
 scene(5,END+1,`${TT(T.s2[0],'.3')}${SB(T.s2[1],'.7')}`,LOGOV,'outroT',{visFirst:true,vh:LY.dir==='row'?560:(LY.H>1000?500:520),sc:(LY.dir==='column'&&LY.H<1000)?.5:0});
}
if(VID==='howto'){END=20.5;
 scene(0,3.2,`${K(T.s0[0],'.3')}${TT(T.s0[1],'.5')}${SB(T.s0[2],'.8')}`,LOGOV,'intro',{visFirst:true});
 scene(3.2,7,`${K(T.s1[0])}${TT(T.s1[1])}`,home(T.btn),'home',{tfk:.85});
 scene(7,10.8,`${K(T.s2[0])}${TT(T.s2[1])}${SB(T.s2[2])}`,nameForm(T.lbl),'name',{tfk:.85});
 scene(10.8,14.4,`${K(T.s3[0])}${TT(T.s3[1])}${SB(T.s3[2])}`,table({cap:1}),'table',{clip:true,tfk:.85});
 scene(14.4,17.2,`${K(T.s4[0])}${TT(T.s4[1])}${SB(T.s4[2])}`,table({cap:1,zoom:[.86,.93,2.3]}),'zoom',{clip:true,tfk:.85});
 outro(17.2,END+1,T.out);
}
if(VID==='cover'){END=1;const d=document.createElement('div');d.className='scene';d.style.opacity=1;
 d.innerHTML=`<div class="a" style="left:110px;top:100px;width:520px;height:520px">${LOGO}</div><div class="a" style="left:640px;top:40px;width:640px;height:560px;transform:scale(1.14);transform-origin:0 0;overflow:hidden;border-radius:30px">${table({cap:1})}</div>`;
 $('#scenes').appendChild(d);$('#url').style.display='none';$('#prog').style.display='none';scenes.push({el:d,s:0,e:9,kind:'cover',ins:[]});}
// confettis
const CONF=[];(function(){let seed=11;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};const cols=['#ff7a59','#c9a86a','#fdfbf0','#e0c27a'];
 for(let i=0;i<46;i++){const d=document.createElement('div');d.className='a';const w=9+r()*11;d.style.cssText=`width:${w}px;height:${w*.5}px;background:${cols[i%4]};border-radius:2px`;$('#conf').appendChild(d);CONF.push({d,x:r()*LY.W,v:150+r()*200,r:r()*360,vr:(r()-.5)*500,sw:r()*30,ph:r()*6});}})();
// ---------- animation ----------
const cl=x=>Math.max(0,Math.min(1,x)),seg=(t,a,b)=>cl((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function wink(el,on){el.querySelectorAll('.eyeW').forEach(x=>{x.style.opacity=on?1:0;});}
function wave(el,lt,a,b){const e=Math.min(seg(lt,a,a+.3),1-seg(lt,b-.3,b));const ang=e*(52+22*Math.sin((lt-a)*Math.PI*2*2.2));el.querySelectorAll('.wingI').forEach(w=>w.style.transform=`rotate(${-ang}deg)`);}
const OUTK=['outro','outroT'];
function render(t){
 $('#prog').style.width=(t/END*100)+'%';
 const sOut=scenes.find(x=>OUTK.includes(x.kind));
 $('#url').style.opacity=(t>(scenes[1]?scenes[1].s:0)&&(!sOut||t<sOut.s))?1:0;
 scenes.forEach(sc=>{const lt=t-sc.s,dur=sc.e-sc.s,on=t>=sc.s&&t<sc.e;
  if(sc.kind==='cover')return;if(!on){sc.el.style.opacity=0;return;}
  const out=OUTK.includes(sc.kind)?0:seg(lt,dur-.3,dur);sc.el.style.opacity=Math.min(seg(lt,0,.2),1-out);sc.el.style.transform=`translateX(${-out*60}px)`;
  sc.ins.forEach(e=>{const p=seg(lt,+e.dataset.d,+e.dataset.d+.5);e.style.opacity=eo(p);e.style.transform=(e.dataset.sc?`scale(${e.dataset.sc}) `:'')+`translateY(${(1-back(p))*40}px) scale(${.85+.15*back(p)})`;});
  const E=sc.el;
  if(sc.kind==='intro'){wave(E,lt,.9,2.9);wink(E,lt>1.6&&lt<1.95);}
  if(OUTK.includes(sc.kind)){wave(E,lt,.6,2.8);wink(E,(lt>1.3&&lt<1.65)||(lt>3.6&&lt<3.9));const c=E.querySelector('.cta');if(c)c.style.transform=`scale(${1+.04*Math.sin(Math.max(0,lt-1.2)*5)})`;}
  E.querySelectorAll('.zoomw[data-zoom]').forEach(z=>{const [u,v,s]=z.dataset.zoom.split(',').map(Number);const fx=SCR.x+SCR.w*u,fy=SCR.y+SCR.h*v;const k=eio(seg(lt,.9,2.1));
   z.style.transformOrigin=`${fx}px ${fy}px`;z.style.transform=`translate(${(320-fx)*k}px,${(280-fy)*k}px) scale(${1+(s-1)*k})`;});
  if(sc.kind==='table'){E.querySelectorAll('.zoomw').forEach(z=>{z.style.transformOrigin='320px 280px';z.style.transform=`scale(${1+.04*seg(lt,0,dur)})`;});}
  if(sc.kind==='tease'){E.querySelectorAll('.qm').forEach(q=>q.style.transform=`scale(${1+.08*Math.sin(lt*4)})`);E.querySelectorAll('.zoomw').forEach(z=>{z.style.transformOrigin='320px 280px';z.style.transform=`scale(${1.02+.06*seg(lt,0,dur)}) rotate(${-1.5+1.5*seg(lt,0,dur)}deg)`;});}
  if(sc.kind==='checks'){E.querySelectorAll('.ci').forEach(c=>{const p=seg(lt,.5+(+c.dataset.i)*.35,.85+(+c.dataset.i)*.35);c.style.opacity=.15+.85*eo(p);c.style.transform=`translateX(${(1-eo(p))*30}px)`;});}
  if(sc.kind==='places'){E.querySelectorAll('.pl').forEach(c=>{const p=seg(lt,.3+(+c.dataset.i)*.25,.75+(+c.dataset.i)*.25);c.style.opacity=eo(p);c.style.transform=`translateY(${(1-back(p))*50}px)`;});
   const th=E.querySelector('.thx');const p=seg(lt,1.2,1.7);th.style.opacity=eo(p);th.style.transform=`scale(${.85+.15*back(p)})`;wave(E,lt,1.4,3.0);}
  if(sc.kind==='home'){const tp=E.querySelector('.tap'),b=E.querySelector('.hb');const p=seg(lt,1.4,2.0);tp.style.opacity=p>0&&p<1?1-p:0;tp.style.transform=`scale(${.4+p})`;b.style.transform=`scale(${lt>1.4&&lt<1.7?.93:1+.03*Math.sin(lt*5)})`;}
  if(sc.kind==='name'){const word='Guy';const n=Math.floor(seg(lt,.9,1.8)*word.length+.001);E.querySelector('.typed').textContent=word.slice(0,n);E.querySelector('.caret').style.opacity=Math.sin(lt*9)>0?1:0;}
 });
 const ct=(scenes[0].kind==='intro'&&t<3)?t-.3:(sOut&&t>=sOut.s+.1?t-sOut.s-.1:-1);
 CONF.forEach(c=>{if(ct<0||ct>5){c.d.style.opacity=0;return;}c.d.style.opacity=1;c.d.style.transform=`translate(${c.x+Math.sin(ct*2+c.ph)*c.sw}px,${-30+c.v*ct*(LY.H/900)}px) rotate(${c.r+c.vr*ct}deg)`;});
}
window.render=render;window.END=END;render(0);
</script></body></html>
