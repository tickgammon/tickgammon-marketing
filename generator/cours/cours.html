 const tx=d.querySelector('.txt');tx.style.textAlign=LY.dir==='row'?'left':'center';tx.style.alignItems=LY.dir==='row'?'flex-start':'center';
 if(LY.dir==='row')tx.style.width=(LY.W-w-LY.gap-2*LY.pad)+'px';else tx.style.maxWidth=(LY.W-2*LY.pad)+'px';
 if(opt.tfk)tx.querySelectorAll('.ttl').forEach(t=>t.style.fontSize=`calc(var(--tf)*${opt.tfk})`);
 scenes.push({el:d,s,e,kind,ins:[...d.querySelectorAll('.in')]});return d;}
const K=(k,d='.05')=>`<div class="kick in" data-d="${d}">${k}</div>`;
const TT=(t,d='.2')=>`<div class="ttl in" data-d="${d}">${t}</div>`;
const SB=(t,d='.45')=>t?`<div class="sub in" data-d="${d}">${t}</div>`:'';
const LOGOV=`<div class="a" style="left:100px;top:60px;width:440px;height:440px"><div class="logo" style="width:100%;height:100%">${LOGO}</div></div>`;
function outro(s,e,o){const card=`<div class="card in" data-d=".6" style="text-align:center;padding:calc(var(--sf)*.8) calc(var(--sf)*1.1);margin-top:calc(var(--sf)*.4);width:min(100%,calc(var(--sf)*17))">
 <div style="font-weight:800;letter-spacing:3px;font-size:calc(var(--sf)*.6);color:#8a6a3a;text-transform:uppercase">${o[1]}</div>
 <div class="btnff bf" style="font-size:calc(var(--sf)*1.05);margin:.35em 0 .1em">${CAPICO()}<span>${o[2]}</span></div>
 <div style="border-top:3px dashed #d8ceb0;margin:.7em 0"></div>
 <div class="cta bf" style="display:inline-block;background:#0d3326;color:#c9a86a;border-radius:999px;padding:.35em 1em;font-size:calc(var(--sf)*1.05)">tickgammon.com →</div></div>`;
 return scene(s,e,`${TT(o[0],'.3')}${card}${SB(o[3],'1.0')}`,LOGOV,'outro',{visFirst:true,vh:LY.dir==='row'?560:(LY.H>1000?500:520),sc:(LY.dir==='column'&&LY.H<1000)?.36:0,tfk:.8});}
const I=(s,e,t)=>scene(s,e,`${K(t[0],'.4')}${TT(t[1],'.6')}${SB(t[2],'.9')}`,LOGOV,'intro',{visFirst:true,tfk:1.1});
const N=(s,e,t,vis,kind)=>scene(s,e,`${K(t[0])}${TT(t[1])}${SB(t[2])}`,vis,kind||'shot',{tfk:.85});
let END;const CUTS=[];
function build(list){let t=0;list.forEach(([d,fn])=>{fn(t,t+d);CUTS.push(t);t+=d;});END=t;}
if(VID==='collectifs')build([[3.4,(a,b)=>I(a,b,T.s1)],[4,(a,b)=>N(a,b,T.s2,courseCard(T.card),'book')],[4.2,(a,b)=>N(a,b,T.s3,SH.salle())],
 [4,(a,b)=>N(a,b,T.s4,checks(T.checks),'checks')],[3.8,(a,b)=>N(a,b,T.s5,SH.conseils())],[5.2,(a,b)=>outro(a,b+1,T.out)]]);
if(VID==='particuliers')build([[3.4,(a,b)=>I(a,b,T.s1)],[3.6,(a,b)=>N(a,b,T.s2,SH.tuile())],[3.6,(a,b)=>N(a,b,T.s3,SH.fiche())],
 [4.4,(a,b)=>N(a,b,T.s4,reqForm(T.form),'req')],[4,(a,b)=>N(a,b,T.s5,checks(T.checks),'checks')],[5.2,(a,b)=>outro(a,b+1,T.out)]]);
if(VID==='prof')build([[3.4,(a,b)=>I(a,b,T.s1)],[3.8,(a,b)=>N(a,b,T.s2,SH.offre())],[3.8,(a,b)=>N(a,b,T.s3,SH.dash())],
 [3.8,(a,b)=>N(a,b,T.s4,split(T.split),'split')],[4,(a,b)=>N(a,b,T.s5,checks(T.checks),'checks')],[5.2,(a,b)=>outro(a,b+1,T.out)]]);
if(VID==='whatsapp')build([[3.6,(a,b)=>I(a,b,T.s1)],[4,(a,b)=>N(a,b,T.s2,courseCard(T.card),'book')],[4,(a,b)=>N(a,b,T.s3,SH.salle())],
 [4,(a,b)=>N(a,b,T.s4,SH.fiche())],[4.2,(a,b)=>N(a,b,T.s5,checks(T.checks),'checks')],[5.4,(a,b)=>outro(a,b+1,T.out)]]);
// confettis
const CONF=[];(function(){let seed=11;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};const cols=['#ff7a59','#c9a86a','#fdfbf0','#e0c27a'];
 for(let i=0;i<46;i++){const d=document.createElement('div');d.className='a';const w=9+r()*11;d.style.cssText=`width:${w}px;height:${w*.5}px;background:${cols[i%4]};border-radius:2px`;$('#conf').appendChild(d);CONF.push({d,x:r()*LY.W,v:150+r()*200,r:r()*360,vr:(r()-.5)*500,sw:r()*30,ph:r()*6});}})();
// ---------- animation ----------
const cl=x=>Math.max(0,Math.min(1,x)),seg=(t,a,b)=>cl((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function wink(el,on){el.querySelectorAll('.eyeW').forEach(x=>{x.style.opacity=on?1:0;});}
function wave(el,lt,a,b){const e=Math.min(seg(lt,a,a+.3),1-seg(lt,b-.3,b));const ang=e*(52+22*Math.sin((lt-a)*Math.PI*2*2.2));el.querySelectorAll('.wingI').forEach(w=>w.style.transform=`rotate(${-ang}deg)`);}
function render(t){
 $('#prog').style.width=(t/END*100)+'%';
 const sOut=scenes.find(x=>x.kind==='outro');
 $('#url').style.opacity=(t>scenes[1].s&&t<sOut.s)?1:0;
 scenes.forEach(sc=>{const lt=t-sc.s,dur=sc.e-sc.s,on=t>=sc.s&&t<sc.e;
  if(!on){sc.el.style.opacity=0;return;}
  const out=sc.kind==='outro'?0:seg(lt,dur-.3,dur);sc.el.style.opacity=Math.min(seg(lt,0,.2),1-out);sc.el.style.transform=`translateX(${-out*60}px)`;
  sc.ins.forEach(e=>{const p=seg(lt,+e.dataset.d,+e.dataset.d+.5);e.style.opacity=eo(p);e.style.transform=(e.dataset.sc?`scale(${e.dataset.sc}) `:'')+`translateY(${(1-back(p))*40}px) scale(${.85+.15*back(p)})`;});
  const E=sc.el;
  if(sc.kind==='intro'){wave(E,lt,.9,2.9);wink(E,lt>1.6&&lt<1.95);}
  if(sc.kind==='outro'){wave(E,lt,.6,2.8);wink(E,(lt>1.3&&lt<1.65)||(lt>3.6&&lt<3.9));const c=E.querySelector('.cta');if(c)c.style.transform=`scale(${1+.04*Math.sin(Math.max(0,lt-1.2)*5)})`;}
  E.querySelectorAll('.kb img').forEach(im=>{const z=1+.07*seg(lt,.4,dur);im.parentNode.style.transform=`scale(${z})`;});
  if(sc.kind==='checks'){E.querySelectorAll('.ci').forEach(c=>{const p=seg(lt,.5+(+c.dataset.i)*.4,.85+(+c.dataset.i)*.4);c.style.opacity=.15+.85*eo(p);c.style.transform=`translateX(${(1-eo(p))*30}px)`;});}
  if(sc.kind==='book'||sc.kind==='req'){const at=sc.kind==='book'?2.2:3.0;const tp=E.querySelector('.tap'),b=E.querySelector('.hb');const p=seg(lt,at,at+.6);tp.style.opacity=p>0&&p<1?1-p:0;tp.style.transform=`scale(${.4+p})`;b.style.transform=`scale(${lt>at&&lt<at+.3?.93:1+.03*Math.sin(lt*5)})`;}
  if(sc.kind==='req'){E.querySelectorAll('.th').forEach(c=>{c.classList.toggle('on',+c.dataset.i===0?lt>.9:(+c.dataset.i===2&&lt>1.3));});
   const m=T.form.msg;const n=Math.floor(seg(lt,1.5,2.8)*m.length+.001);E.querySelector('.typed').textContent=m.slice(0,n);E.querySelector('.caret').style.opacity=Math.sin(lt*9)>0?1:0;}
  if(sc.kind==='split'){[['.sp1',.6],['.sp2',1.0]].forEach(([q,a])=>{const x=E.querySelector(q);const p=seg(lt,a,a+.5);x.style.opacity=eo(p);x.style.transform=`scale(${.8+.2*back(p)})`;});}
 });
 const ct=t<3?t-.3:(t>=sOut.s+.1?t-sOut.s-.1:-1);
 CONF.forEach(c=>{if(ct<0||ct>5){c.d.style.opacity=0;return;}c.d.style.opacity=1;c.d.style.transform=`translate(${c.x+Math.sin(ct*2+c.ph)*c.sw}px,${-30+c.v*ct*(LY.H/900)}px) rotate(${c.r+c.vr*ct}deg)`;});
}
window.render=render;window.END=END;window.CUTS=CUTS;render(0);
</script></body></html>
