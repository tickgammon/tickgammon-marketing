<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Bricolage Grotesque';font-weight:800;src:url(../fridaycup/fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:700;src:url(../fridaycup/fonts/manrope-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:800;src:url(../fridaycup/fonts/manrope-latin-800-normal.woff2) format('woff2')}
html,body{margin:0;background:#0b1a33}
#s{position:relative;width:1080px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 70% 30%,#1d4a7d 0%,#0b1a33 68%);font-family:Manrope,sans-serif;color:#fdfbf0}
.a{position:absolute}
.bf{font-family:'Bricolage Grotesque',sans-serif;font-weight:800}
.kick{display:inline-block;background:#d4a94a;color:#0b1a33;font-weight:800;letter-spacing:3px;text-transform:uppercase;border-radius:999px;padding:12px 24px;font-size:22px}
em{font-style:normal;color:#e6c47c}
.pill{display:inline-flex;align-items:center;gap:10px;background:rgba(253,251,240,.1);border:2px solid rgba(230,196,124,.55);border-radius:999px;padding:10px 22px;font-weight:800;font-size:24px}
#ia{left:24px;bottom:24px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:800;font-size:18px;border-radius:999px;padding:6px 16px}
</style></head><body><div id="s">
<div id="stars" class="a" style="inset:0"></div>
<div class="a" style="left:64px;top:60px"><span class="kick" id="k"></span></div>
<div class="a" style="right:56px;top:52px;width:330px;height:330px">
 <svg viewBox="0 0 520 520" width="100%" height="100%" style="position:absolute;inset:0"><defs>
 <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d77a"/><stop offset=".5" stop-color="#c99a3a"/><stop offset="1" stop-color="#f1cf6e"/></linearGradient>
 <radialGradient id="gr" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#1c5a3c"/><stop offset="1" stop-color="#0f3a26"/></radialGradient></defs>
 <circle cx="260" cy="260" r="256" fill="url(#gd)"/><circle cx="260" cy="260" r="243" fill="url(#gr)"/></svg>
 <div style="position:absolute;left:11.9%;top:14.6%;width:76.2%;height:72.3%">
 <img src="../owl_base.png" style="position:absolute;inset:0;width:100%;height:100%">
 <img src="../owl_wing.png" style="position:absolute;inset:0;width:100%;height:100%;transform-origin:70.8% 53.5%;transform:rotate(-14deg)">
 </div>
 <div class="a" style="left:-30px;top:-14px;font-size:84px;transform:rotate(-14deg)">🏆</div>
</div>
<div class="a" style="left:64px;top:150px;width:620px">
 <div class="bf" id="t" style="font-size:96px;line-height:.9;letter-spacing:-3px;text-transform:uppercase"></div>
 <div id="d" style="white-space:nowrap;margin-top:26px;font-size:36px;font-weight:800;color:#dce8f5"></div>
</div>
<div class="a" style="left:64px;top:560px;right:64px;display:flex;gap:34px;align-items:center">
 <div style="flex:0 0 auto">
  <div class="bf" style="font-size:150px;line-height:.9;color:transparent;-webkit-text-stroke:4px #e6c47c"><span id="nn"></span></div>
  <div id="o" style="font-size:34px;font-weight:800;margin-top:8px"></div>
  <div id="r" style="font-size:22px;font-weight:700;color:#b9c9e0;margin-top:6px"></div>
 </div>
 <div style="flex:1 1 auto;position:relative">
  <img src="plateau_hiver_2027.png" style="width:100%;border-radius:18px;border:4px solid #d4a94a;box-shadow:0 12px 0 rgba(0,0,0,.35);display:block">
  <div id="p" class="a bf" style="left:50%;bottom:-24px;transform:translateX(-50%);white-space:nowrap;background:#d4a94a;color:#0b1a33;border-radius:999px;padding:8px 22px;font-size:26px;box-shadow:0 5px 0 #8a6a3a"></div>
 </div>
</div>
<div class="a" style="left:64px;right:64px;bottom:86px;display:flex;gap:16px;flex-wrap:wrap" id="pills"></div>
<div class="a bf" style="right:64px;bottom:30px;font-size:24px;letter-spacing:3px;color:#e6c47c">TICKGAMMON.COM</div>
<div id="ia" class="a"></div>
</div>
<script>
const L=window.LANG||'fr';
const T={
fr:{k:'TickGammon · Tournoi officiel',t:'Le tournoi <em>Hiver 2027</em>',d:'Samedi 16 janvier · 21h',o:'TGC offerts',r:'1 500 · 800 · 350 · 350',p:'🎁 + le plateau Hiver 2027 au vainqueur',pills:['🆓 Gratuit','🌍 Ouvert à tous','🏆 3 points · finale en 5'],ia:'🤖 Créé avec l’IA',n:'3 000'},
en:{k:'TickGammon · Official tournament',t:'The <em>Winter 2027</em> cup',d:'Saturday, January 16 · 9 PM (Paris)',o:'TGC offered',r:'1,500 · 800 · 350 · 350',p:'🎁 + the Winter 2027 board for the winner',pills:['🆓 Free','🌍 Open to all','🏆 3 points · final to 5'],ia:'🤖 Made with AI',n:'3,000'},
es:{k:'TickGammon · Torneo oficial',t:'El torneo <em>Invierno 2027</em>',d:'Sábado 16 de enero · 21h (París)',o:'TGC de regalo',r:'1.500 · 800 · 350 · 350',p:'🎁 + el tablero Invierno 2027 al ganador',pills:['🆓 Gratis','🌍 Abierto a todos','🏆 3 puntos · final a 5'],ia:'🤖 Creado con IA',n:'3.000'}}[L];
k.textContent=T.k;nn.textContent=T.n;t.innerHTML=T.t;d.textContent=T.d;o.textContent=T.o;r.textContent=T.r;p.textContent=T.p;ia.textContent=T.ia;
pills.innerHTML=T.pills.map(x=>`<span class="pill">${x}</span>`).join('');
let h='';let s=7;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
for(let i=0;i<70;i++){const x=rnd()*1080,y=rnd()*1080,z=1+rnd()*3;h+=`<div class="a" style="left:${x}px;top:${y}px;width:${z}px;height:${z}px;border-radius:50%;background:#fdfbf0;opacity:${.25+rnd()*.5}"></div>`}
for(let i=0;i<14;i++){const x=rnd()*1080,y=rnd()*520,c=['#d4a94a','#e24b55','#fdfbf0'][i%3];h+=`<div class="a" style="left:${x}px;top:${y}px;width:16px;height:7px;background:${c};transform:rotate(${rnd()*180}deg)"></div>`}
stars.innerHTML=h;
const box=t.parentNode;let fs=96;while(box.offsetHeight>390&&fs>50){fs-=4;t.style.fontSize=fs+'px'}let ds=36;while(d.scrollWidth>620&&ds>22){ds-=2;d.style.fontSize=ds+'px'}
</script></body></html>
