</style></head><body><div id="s">

 <span id="brand"><span id="brandtxt"></span><span id="mini" style="width:38px;height:38px;display:inline-block"></span></span></div>

</div>
<script>
const $=s=>document.querySelector(s);
const LANG=window.LANG||'fr';
const STR={fr:{
 chap:['Introduction','Le but du jeu','Le plateau et le matériel','La position de départ','Lancer les dés et déplacer ses pions','Frapper un pion et la barre','Sortir ses pions','Simple, gammon, backgammon','Le videau et la règle de Crawford','Conclusion'],
 chapw:'Chapitre',brand:'LES LEÇONS DE LA CHOUETTE',
 t_series:'Les leçons<br>de la <em>chouette</em>',t_ep:'Épisode 1 · Les règles du backgammon',
 years:'ans',meso:'Mésopotamie',today:"Aujourd'hui",chance:'La chance',strat:'La stratégie',dice:'les dés',choices:'vos choix',
 checkers:'pions',barre:'Barre',home:'Jan intérieur',homes:'votre maison',outer:'Jan extérieur',
 cube:'Le videau',whites:'Blancs',blacks:'Noirs',start:'Position de départ',
 wstart:'Les Blancs commencent avec 5-2',good:'Bon à savoir',
 r1:'Utilisez vos deux dés si possible',r2:'Un seul dé jouable ? Le plus fort',r3:'Aucun coup possible ? Tour passé',
 blot:'Blot',tac:'Tac !',passed:'Tour passé',tip:'Le conseil de la chouette',safe:'À l’abri',prime:'Prime',
 oups:'Oups !',simple:'Simple',gammon:'Gammon',bg:'Backgammon',xcube:'× videau',idouble:'Je double !',
 refuse:'Refuse',accept:'Accepte',over:'Partie terminée',match:'Match en 5 points',crawford:'Règle de Crawford',nocube:'sans videau',
 recap:['Le but','Le plateau','Le départ','Déplacer','Frapper','Sortir'],
 play:'Jouez gratuitement',where:'Navigateur · Android · Windows',next:'Prochaine leçon',nextt:'Les ouvertures',sub:'Abonnez-vous !',
 haha:'Ha ha !',ep:'Épisode 1',vs:'contre'
}};
const S=STR[LANG];
const D=window.DATA, TL=D.tl, ENV=D.env, TOTAL=D.total;
// ---------- utilitaires
const cl=x=>Math.max(0,Math.min(1,x)),seg=(t,a,b)=>cl((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),
 eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const fade=(lt,a,b,D,fo=.25)=>Math.min(eo(seg(lt,a,a+fo)),1-seg(lt,b-fo,b));
const PIPS={1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,26],[72,26],[28,50],[72,50],[28,74],[72,74]]};
function dieSvg(v,c='#fdfbf0',sz=84){const pc=c==='#fdfbf0'?'#0d3326':'#fdfbf0';return `<svg viewBox="0 0 100 100" width="${sz}" height="${sz}"><rect x="4" y="8" width="92" height="88" rx="18" fill="rgba(0,0,0,.25)"/><rect x="4" y="4" width="92" height="88" rx="18" fill="${c}"/>${(PIPS[v]||[]).map(p=>`<circle cx="${p[0]}" cy="${p[1]-2}" r="9" fill="${pc}"/>`).join('')}</svg>`;}
function cubeSvg(v,sz=90){return `<svg viewBox="0 0 100 100" width="${sz}" height="${sz}"><rect x="6" y="10" width="88" height="86" rx="14" fill="rgba(0,0,0,.25)"/><rect x="6" y="6" width="88" height="86" rx="14" fill="#c9a86a" stroke="#f6d77a" stroke-width="3"/><text x="50" y="${v>9?64:68}" text-anchor="middle" font-family="Brico" font-weight="800" font-size="${v>9?42:52}" fill="#0d3326">${v}</text></svg>`;}
// ---------- chouette officielle
const EYE=(cx)=>`<circle cx="${cx}" cy="148" r="54" fill="#fdeecf"/><path d="M${cx-38} 158 Q${cx} 120 ${cx+38} 158" stroke="#0b2a17" stroke-width="11" fill="none" stroke-linecap="round"/>`;
$('#owl').innerHTML=`<div style="position:relative;width:100%;height:100%">
<img src="owl_base.png" style="position:absolute;inset:0;width:100%;height:100%">
<svg id="eyeR" viewBox="0 0 600 570" style="position:absolute;inset:0;width:100%;height:100%;opacity:0">${EYE(365)}</svg>
<svg id="eyeL" viewBox="0 0 600 570" style="position:absolute;inset:0;width:100%;height:100%;opacity:0">${EYE(222)}</svg>
<img id="wing" src="owl_wing.png" style="position:absolute;inset:0;width:100%;height:100%;transform-origin:70.8% 53.5%">
</div>`;
const LOGO=`<svg viewBox="0 0 520 520" width="100%" height="100%"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d77a"/><stop offset=".5" stop-color="#c99a3a"/><stop offset="1" stop-color="#f1cf6e"/></linearGradient></defs><circle cx="260" cy="260" r="256" fill="url(#gd)"/><circle cx="260" cy="260" r="243" fill="#145035"/><image href="owl_base.png" x="62" y="76" width="396" height="376"/></svg>`;
$('#mini').innerHTML=LOGO;$('#brandtxt').textContent=S.brand;

// ---------- plateau (viewBox 820x500)
const BW=820,BH=500,F=16,BAR=52,HALF=338,PW=HALF/6,R=22.5,TRI=187,TRX=752;
const COL={frame:'#5a3418',felt:'#2f6b4c',a:'#c9a86a',b:'#6b4226',bar:'#4a2a12',w:'#fdfbf0',bk:'#2a1d16'};
const pxL=i=>{const k=i<12?11-i:i-12;return F+(k<6?0:HALF+BAR)+(k%6)*PW;};
const cx=i=>pxL(i)+PW/2, isTop=i=>i>=12;
const W=n=>n-1, B=n=>24-n; // points vus des Blancs / des Noirs
function stepFor(n){return n<=5?2*R:Math.min(2*R,(232-2*R)/(n-1));}
function slot(i,j,n){const st=stepFor(Math.max(n,j+1));return [cx(i),isTop(i)?F+R+j*st:BH-F-R-j*st];}
function barSlot(c,j){return [F+HALF+BAR/2,c==='w'?300+j*40:200-j*40];}
function offSlot(c,j){return [TRX+26,c==='w'?BH-F-8-j*12:F+8+j*12];}
function newState(){return {p:Array(24).fill(0),barW:0,barB:0,offW:0,offB:0};}
function startState(){const s=newState();[[W(24),2],[W(13),5],[W(8),3],[W(6),5]].forEach(([i,n])=>s.p[i]+=n);[[B(24),2],[B(13),5],[B(8),3],[B(6),5]].forEach(([i,n])=>s.p[i]-=n);return s;}
function clone(s){return {p:s.p.slice(),barW:s.barW,barB:s.barB,offW:s.offW,offB:s.offB};}
function cnt(s,c,loc){if(loc==='bar')return c==='w'?s.barW:s.barB;if(loc==='off')return c==='w'?s.offW:s.offB;const v=s.p[loc];return c==='w'?Math.max(0,v):Math.max(0,-v);}
function take(s,c,loc){if(loc==='bar'){c==='w'?s.barW--:s.barB--;return;}if(loc==='off'){c==='w'?s.offW--:s.offB--;return;}s.p[loc]+=c==='w'?-1:1;}
function put(s,c,loc){if(loc==='bar'){c==='w'?s.barW++:s.barB++;return;}if(loc==='off'){c==='w'?s.offW++:s.offB++;return;}s.p[loc]+=c==='w'?1:-1;}
function posOf(s,c,loc,j){if(loc==='bar')return barSlot(c,j);if(loc==='off')return offSlot(c,j);return slot(loc,j,Math.abs(s.p[loc])+1);}
// applique les mouvements {c,f,t,a,b}
function applyMoves(base,mv,lt){const s=clone(base);let fly=[];for(const m of mv){if(lt>=m.b){take(s,m.c,m.f);put(s,m.c,m.t);}else if(lt>m.a){const p=eio(seg(lt,m.a,m.b));const n0=cnt(s,m.c,m.f);const A=posOf(s,m.c,m.f,n0-1);take(s,m.c,m.f);const n1=cnt(s,m.c,m.t);const Bp=posOf(s,m.c,m.t,n1);const lift=m.t==='bar'?30:70;fly.push({c:m.c,x:A[0]+(Bp[0]-A[0])*p,y:A[1]+(Bp[1]-A[1])*p-lift*Math.sin(Math.PI*p),off:m.t==='off'&&p>.85});}}return {s,fly};}
function chk(x,y,c,al=1,sc=1){const fill=c==='w'?COL.w:COL.bk,st=c==='w'?'#b9a77c':'#c9a86a';return `<g opacity="${al}" transform="translate(${x} ${y}) scale(${sc})"><circle r="${R*.96}" cy="3" fill="rgba(0,0,0,.35)"/><circle r="${R*.96}" fill="${fill}" stroke="${st}" stroke-width="2.5"/><circle r="${R*.58}" fill="none" stroke="${c==='w'?'rgba(0,0,0,.12)':'rgba(255,255,255,.16)'}" stroke-width="2.5"/></g>`;}
function triPath(i,inset=0){const x=pxL(i);return isTop(i)?`M${x+inset} ${F} L${x+PW-inset} ${F} L${x+PW/2} ${F+TRI} Z`:`M${x+inset} ${BH-F} L${x+PW-inset} ${BH-F} L${x+PW/2} ${BH-F-TRI} Z`;}
function tag(x,y,txt,bg='#ff7a59',fg='#0d3326',fs=22,al=1){const w=txt.length*fs*.58+26;return `<g opacity="${al}"><rect x="${x-w/2}" y="${y-fs*.8}" width="${w}" height="${fs*1.6}" rx="${fs*.8}" fill="${bg}"/><text x="${x}" y="${y+fs*.36}" text-anchor="middle" font-family="Brico" font-weight="800" font-size="${fs}" fill="${fg}">${txt}</text></g>`;}
function drawBoard(o){
 const lt=o.lt||0,{s,fly}=applyMoves(o.st||newState(),o.mv||[],lt);
 let g=`<svg viewBox="0 0 ${BW} ${BH}" width="760" height="463"><rect width="${BW}" height="${BH}" rx="22" fill="${COL.frame}"/>
 <rect x="${F}" y="${F}" width="${HALF*2+BAR}" height="${BH-2*F}" rx="6" fill="${COL.felt}"/>
 <rect x="${F+HALF}" y="${F}" width="${BAR}" height="${BH-2*F}" fill="${COL.bar}"/>
 <rect x="${TRX}" y="${F}" width="52" height="${BH-2*F}" rx="6" fill="#3e230f"/>`;
 // zones
 (o.zones||[]).forEach(z=>{if(!z.al)return;const xs=[];for(let i=z.a;i<=z.b;i++)xs.push(pxL(i));const x0=Math.min(...xs),x1=Math.max(...xs)+PW,tp=isTop(z.a);g+=`<rect x="${x0}" y="${tp?F:BH-F-232}" width="${x1-x0}" height="232" fill="${z.c||'#ff7a59'}" opacity="${.28*z.al}"/>`;});
 for(let i=0;i<24;i++){g+=`<path d="${triPath(i)}" fill="${i%2?COL.b:COL.a}"/>`;const h=(o.hl||[]).find(h=>h.i===i);if(h&&h.al>0)g+=`<path d="${triPath(i)}" fill="${h.c||'#fff6c8'}" opacity="${.75*h.al}"/>`;}
 if(o.barHl)g+=`<rect x="${F+HALF}" y="${F}" width="${BAR}" height="${BH-2*F}" fill="#fff6c8" opacity="${.6*o.barHl}"/>`;
 if(o.doorHl!=null){g+=`<rect x="${TRX}" y="${F}" width="52" height="${BH-2*F}" rx="6" fill="${o.doorCol||'#7fe0a0'}" opacity="${.55*o.doorHl}"/>`;}
 // labels
 if(o.labels){const al=o.labels.al??1;for(let i=0;i<24;i++){const n=o.labels.side==='b'?24-i:i+1;const y=isTop(i)?F+TRI+22:BH-F-TRI-12;const sh=o.labels.n?Math.min(1,Math.max(0,o.labels.n-(o.labels.side==='b'?(24-n):(n-1)))):1;if(sh<=0)continue;g+=`<text x="${cx(i)}" y="${y}" text-anchor="middle" font-family="Brico" font-weight="800" font-size="22" fill="${o.labels.side==='b'?'#ffb39c':'#fdfbf0'}" opacity="${al*sh}">${n}</text>`;}}
 // pions
 const dim=o.dim||{};
 for(let i=0;i<24;i++){const v=s.p[i];if(!v)continue;const c=v>0?'w':'b',n=Math.abs(v);for(let j=0;j<n;j++){const [x,y]=slot(i,j,n);let al=dim[c]??1;if(o.drop&&o.drop[i]){const d=o.drop[i];const pp=cl((lt-d.a-j*d.g)/.35);if(pp<=0)continue;g+=chk(x,y-(1-eo(pp))*120,c,al*pp);continue;}g+=chk(x,y,c,al);}}
 for(let j=0;j<s.barW;j++){const [x,y]=barSlot('w',j);g+=chk(x,y,'w');}
 for(let j=0;j<s.barB;j++){const [x,y]=barSlot('b',j);g+=chk(x,y,'b');}
 for(let j=0;j<s.offW;j++){const [x,y]=offSlot('w',j);g+=`<rect x="${x-21}" y="${y-5}" width="42" height="10" rx="4" fill="${COL.w}" stroke="#b9a77c"/>`;}
 for(let j=0;j<s.offB;j++){const [x,y]=offSlot('b',j);g+=`<rect x="${x-21}" y="${y-5}" width="42" height="10" rx="4" fill="${COL.bk}" stroke="#c9a86a"/>`;}
 fly.forEach(f=>{g+=chk(f.x,f.y,f.c,f.off?.6:1,1.08);});
 // flèches
 (o.paths||[]).forEach(p=>{if(p.p<=0)return;g+=`<path d="${p.d}" fill="none" stroke="${p.c||'#ff7a59'}" stroke-width="${p.w||9}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-p.p}" opacity=".95"/>`;if(p.p>.98&&p.head){const [x,y,a]=p.head;g+=`<path d="M0 -16 L20 0 L0 16 Z" fill="${p.c||'#ff7a59'}" transform="translate(${x} ${y}) rotate(${a})"/>`;}});
 (o.marks||[]).forEach(m=>{if(!(m.al>0))return;const sc=back(m.al);if(m.k==='ok')g+=`<g transform="translate(${m.x} ${m.y}) scale(${sc})"><circle r="24" fill="#3fb36b"/><path d="M-11 0 L-3 9 L12 -9" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  else if(m.k==='no')g+=`<g transform="translate(${m.x} ${m.y}) scale(${sc})"><circle r="26" fill="#e0453a"/><path d="M-10 -10 L10 10 M10 -10 L-10 10" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g>`;
  else if(m.k==='target')g+=`<g transform="translate(${m.x} ${m.y})" opacity="${m.al}"><circle r="${30+6*Math.sin(lt*8)}" fill="none" stroke="#ff7a59" stroke-width="5"/><circle r="${44+6*Math.sin(lt*8)}" fill="none" stroke="#ff7a59" stroke-width="3" opacity=".6"/></g>`;
  else if(m.k==='lock')g+=`<g transform="translate(${m.x} ${m.y}) scale(${sc*.9})"><rect x="-15" y="-4" width="30" height="24" rx="5" fill="#c9a86a"/><path d="M-9 -4 V-11 A9 9 0 0 1 9 -11 V-4" stroke="#c9a86a" stroke-width="5" fill="none"/></g>`;
  else if(m.k==='tag')g+=tag(m.x,m.y,m.t,m.bg,m.fg,m.fs||22,m.al);
  else if(m.k==='burst')g+=`<g transform="translate(${m.x} ${m.y}) scale(${sc})"><path d="${star(14,58,36)}" fill="#ff7a59"/><text y="10" text-anchor="middle" font-family="Brico" font-weight="800" font-size="28" fill="#fdfbf0">${m.t}</text></g>`;
  else if(m.k==='shield')g+=`<g transform="translate(${m.x} ${m.y}) scale(${sc})"><path d="M0 -26 L22 -18 V2 Q22 20 0 30 Q-22 20 -22 2 V-18 Z" fill="#3fb36b" stroke="#fff" stroke-width="3"/><path d="M-9 1 L-2 8 L10 -6" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;
 });
 if(o.wall&&o.wall.al>0){const {a,b,al}=o.wall;const x0=Math.min(pxL(a),pxL(b)),x1=Math.max(pxL(a),pxL(b))+PW;const y0=isTop(a)?F+TRI+10:BH-F-TRI-56;let br='';for(let r=0;r<3;r++)for(let k=0;k<12;k++){const w=(x1-x0)/6;const x=x0+k*w-(r%2)*w/2;if(x+w<=x0||x>=x1)continue;const xa=Math.max(x0,x),xb=Math.min(x1,x+w-3);br+=`<rect x="${xa}" y="${y0+r*16}" width="${xb-xa}" height="13" rx="2" fill="#e0b55a" stroke="#a87a2a"/>`;}
  g+=`<g opacity="${al}" transform="translate(0 ${(1-eo(al))*30})">${br}</g>`;}
 (o.dice||[]).forEach(d=>{if(!(d.al>0))return;g+=`<g transform="translate(${d.x} ${d.y}) rotate(${d.r||0}) scale(${back(d.al)})"><g transform="translate(-28 -28)">${dieSvg(d.v,d.c,56).replace('<svg ','<svg x="0" y="0" ')}</g></g>`;});
 if(o.cube&&o.cube.al>0){const c=o.cube;g+=`<g transform="translate(${c.x} ${c.y}) rotate(${c.r||0}) scale(${back(c.al)})"><g transform="translate(-30 -30)">${cubeSvg(c.v,60).replace('<svg ','<svg x="0" y="0" ')}</g></g>`;}
 return g+'</svg>';}
function star(n,ro,ri){let d='';for(let k=0;k<2*n;k++){const r=k%2?ri:ro,a=Math.PI*k/n;d+=(k?'L':'M')+(r*Math.sin(a)).toFixed(1)+' '+(-r*Math.cos(a)).toFixed(1)+' ';}return d+'Z';}
// chemins (coordonnées plateau)
const yB=BH-F-R, yT=F+R;
const PATH_W=`M${cx(23)} ${yT+60} L${cx(23)} ${yT} L${cx(12)} ${yT} Q${F-0} 250 ${cx(11)} ${yB} L${cx(0)} ${yB} L${TRX+26} ${yB}`;
const PATH_B=`M${cx(0)} ${yB-110} L${cx(0)} ${yB-50} L${cx(11)} ${yB-50} Q${F+50} 250 ${cx(12)} ${yT+50} L${cx(23)} ${yT+50} L${TRX+26} ${yT+50}`;

// ---------- scènes : chaque passage remplit F
const ownT=x=>x;
function homeState(dist){const s=newState();dist.forEach((n,k)=>s.p[k]+=n);return s;}
const SC={
 P01(lt,D,X){X.board=null;X.top=0;X.owl={x:150+(1-eo(seg(lt,0,1.3)))*1000,y:150-Math.sin(seg(lt,0,1.3)*Math.PI)*90,s:1.35,wave:[1.2,4.2],wink:[5.2,5.6]};
  X.ov=`<div class="a" style="left:640px;top:170px;opacity:${eo(seg(lt,1,1.6))};transform:translateX(${(1-eo(seg(lt,1,1.6)))*40}px)">
  <div class="pill">TickGammon</div>
  <div class="big" style="font-size:76px;margin-top:14px">${S.t_series.replace('<em>','<span style="color:#c9a86a">').replace('</em>','</span>')}</div>
  <div style="font-size:26px;font-weight:800;color:#d9e6dc;margin-top:16px;opacity:${eo(seg(lt,1.8,2.4))}">${S.t_ep}</div></div>`;X.owlFront=1;X.conf=lt;},

  X.board={st:s,mv:[{c:'w',f:W(4),t:'off',a:D*.62,b:D*.75}],doorHl:.6,dice:[{x:560,y:250,v:6,al:seg(lt,.3,.6),r:-6}],zones:[{a:4,b:5,al:fade(lt,.6,D*.55,D),c:'#e0453a'}],
   hl:[{i:W(4),al:fade(lt,D*.45,D*.8,D)}],marks:[{k:'tag',x:cx(W(5))-PW/2,y:BH-F-TRI-40,t:'6 > 4',al:eo(seg(lt,D*.35,D*.42))*(1-seg(lt,D*.85,D)),fs:26}]};},
 P33(lt,D,X){const s=homeState([2,3,3,3,2,0]);for(const [i,n] of [[B(13),5],[B(8),3],[B(6),5],[B(24),2]])s.p[i]-=n;s.offW=2;
  X.board={st:s,mv:[{c:'w',f:W(5),t:W(3),a:D*.4,b:D*.6}],dice:[{x:560,y:250,v:2,al:seg(lt,.2,.5),r:-6}],hl:[{i:W(3),al:fade(lt,D*.55,D,D)}]};},
 P34(lt,D,X){const s=homeState([2,3,3,1,2,0]);s.p[B(24)]=0;s.p[W(3)]=1;s.p[W(13)]=0;s.p[W(10)]=-1;for(const [i,n] of [[B(13),4],[B(8),3],[B(6),5]])s.p[i]-=n;s.offW=4;const h=D*.3;
  X.board={st:s,mv:[{c:'w',f:W(3),t:'bar',a:h+.65,b:h+1.4},{c:'b',f:W(10),t:W(3),a:h,b:h+.8}],doorHl:1-seg(lt,h+1.6,h+2.2),doorCol:lt>h+1.6?'#e0453a':'#7fe0a0',marks:[{k:'burst',x:cx(W(3)),y:BH-F-110,t:S.tac,al:fade(lt,h+.8,h+2,D)}]};
  if(lt>h+1.6){X.board.doorHl=seg(lt,h+1.6,h+2.2);}X.bubble={t:S.oups,a:h+1.2,b:D};X.shake=[h+1.2,h+2];},
 P35(lt,D,X){X.board=null;X.ov=scoreTable(lt,D,0);},
 P36(lt,D,X){X.board=null;X.ov=scoreTable(lt,D,1);},
 P37(lt,D,X){X.board=null;X.ov=scoreTable(lt,D,2);},
 P38(lt,D,X){X.board=null;X.ov=scoreTable(lt,D,3);X.conf=lt-D*.7;},
 P39(lt,D,X){X.board=null;X.ov=scoreTable(lt,D,4);},
 P40(lt,D,X){X.board={st:startState(),cube:{x:F_+HALF+BAR/2,y:250,v:64,al:seg(lt,.3,.8)},barHl:.25,marks:[{k:'tag',x:F_+HALF+BAR/2,y:315,t:'= 1',al:eo(seg(lt,D*.4,D*.48)),fs:26}]};},
 P41(lt,D,X){const p=eo(seg(lt,.4,1.4));X.board={st:startState(),al:.6};X.ov=`<div class="a" style="left:${400+p*390}px;top:${280-p*20}px;transform:rotate(${(1-p)*-90}deg)">${cubeSvg(p>.6?2:64,110)}</div>`;X.bubble={t:S.idouble,a:1.2,b:D};X.wave=[1.2,D-.4];},
 P42(lt,D,X){X.board={st:startState(),al:.25};X.ov=branch(lt,D,'r');},
 P43(lt,D,X){X.board={st:startState(),al:.25};X.ov=branch(lt,D,'a');},
 P44(lt,D,X){X.board={st:startState(),al:.2};const x=seg(lt,D*.45,D*.55);
  X.ov=`<div class="a" style="left:120px;top:140px;width:620px;text-align:center"><div class="pill">${S.match}</div>
  <div style="display:flex;gap:30px;justify-content:center;align-items:center;margin-top:24px">
   <div class="card" style="padding:16px 30px"><div style="font-weight:800;font-size:20px">${S.whites}</div><div class="bf" style="font-size:80px">4</div></div>
   <div class="bf" style="font-size:60px">–</div>
   <div class="card" style="padding:16px 30px;background:#2a1d16;color:#fdfbf0"><div style="font-weight:800;font-size:20px">${S.blacks}</div><div class="bf" style="font-size:80px">2</div></div>
   <div style="position:relative;margin-left:20px;opacity:${eo(seg(lt,D*.3,D*.38))}">${cubeSvg(1>0?64:2,100)}<svg class="a" style="left:-10px;top:-10px" width="120" height="120"><path d="M14 106 L106 14" stroke="#e0453a" stroke-width="12" stroke-linecap="round" stroke-dasharray="140" stroke-dashoffset="${140*(1-x)}"/></svg></div></div>
  <div class="card bf" style="display:inline-block;margin-top:34px;padding:14px 28px;font-size:34px;background:#c9a86a;opacity:${eo(seg(lt,D*.7,D*.76))};transform:scale(${back(seg(lt,D*.7,D*.76))})">${S.crawford}</div></div>`;},
 P45(lt,D,X){X.board=null;const ic=['🏁','🗺️','📍','🎲','💥','🚪'];
  X.ov=`<div class="a" style="left:60px;top:120px;width:760px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px">${S.recap.map((r,k)=>{const a=seg(lt,.2+k*.35,.6+k*.35);return `<div class="card" style="height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:${eo(a)};transform:scale(${back(a)})"><div style="font-size:54px">${ic[k]}</div><div class="bf" style="font-size:30px">${r}</div></div>`;}).join('')}</div>`;X.clap=[D*.55,D];},
 P46(lt,D,X){X.board=null;X.owl={x:110,y:170,s:1.2,wave:[.3,3.2],wink:[D-2.4,D-2]};X.owlFront=1;
  X.ov=`<div class="a" style="left:640px;top:140px;width:600px">
  <div class="big" style="font-size:48px;opacity:${eo(seg(lt,.2,.6))}">${S.play}</div>
  <div class="card bf" style="display:inline-block;margin-top:20px;padding:16px 34px;font-size:44px;background:#ff7a59;opacity:${eo(seg(lt,.5,.9))};transform:scale(${back(seg(lt,.5,.9))})">tickgammon.com</div>
  <div style="font-weight:800;font-size:24px;color:#d9e6dc;margin-top:18px;opacity:${eo(seg(lt,1.2,1.6))}">${S.where}</div>
  <div class="card" style="margin-top:40px;padding:20px 26px;display:inline-block;opacity:${eo(seg(lt,D*.55,D*.62))};transform:translateY(${(1-eo(seg(lt,D*.55,D*.62)))*30}px)"><div style="font-weight:800;font-size:18px;letter-spacing:2px;color:#ff7a59;text-transform:uppercase">${S.next}</div><div class="bf" style="font-size:42px">${S.nextt}</div></div>
  <div class="pill" style="display:block;width:max-content;margin-top:22px;font-size:22px;opacity:${eo(seg(lt,D*.8,D*.86))}">${S.sub}</div></div>`;X.conf=lt-(D-1.5);}
};
const F_=F;
function scoreTable(lt,D,k){const rows=[[S.simple,'× 1'],[S.gammon,'× 2'],[S.bg,'× 3']];const g=k===0?lt:99;
 const tro=`<svg width="120" height="110" viewBox="0 0 70 64"><path d="M18 6 H52 V22 Q52 40 35 42 Q18 40 18 22 Z" fill="#c9a86a"/><path d="M18 10 Q4 10 6 20 Q8 30 20 30 M52 10 Q66 10 64 20 Q62 30 50 30" stroke="#c9a86a" stroke-width="4" fill="none"/><rect x="31" y="42" width="8" height="10" fill="#c9a86a"/><rect x="22" y="52" width="26" height="8" rx="2" fill="#fdfbf0"/></svg>`;
 return `<div class="a" style="left:80px;top:120px;width:700px">
 <div style="display:flex;align-items:center;gap:20px;margin-bottom:18px;opacity:${k===0?eo(seg(lt,.1,.5)):1}">${tro}<div class="big" style="font-size:44px">${S.whites} 15/15</div></div>
 ${rows.map((r,i)=>{const on=k>i+0||(k===i+1);const vis=k>=i+1;const a=k===i+1?seg(lt,.2,.6):(vis?1:0);const show=k===0?eo(seg(lt,D*.5+i*.25,D*.5+i*.25+.3)):1;
  return `<div style="display:flex;align-items:center;gap:16px;margin-top:12px;opacity:${show}"><div class="card" style="flex:1;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;background:${a>0?'#fdfbf0':'rgba(253,251,240,.15)'};color:${a>0?'#0d3326':'rgba(253,251,240,.5)'};transform:scale(${1+.04*Math.sin(Math.PI*a)})"><span class="bf" style="font-size:36px">${r[0]}</span><span class="bf" style="font-size:40px;color:${a>0?'#ff7a59':'inherit'}">${a>0?r[1]:'?'}</span></div></div>`;}).join('')}
 ${k===4?`<div style="display:flex;align-items:center;gap:20px;margin-top:22px;opacity:${eo(seg(lt,.3,.7))}"><span class="big" style="font-size:44px;color:#c9a86a">${S.xcube}</span><div style="transform:translateX(${(1-eo(seg(lt,1,2)))*300}px) rotate(${(1-eo(seg(lt,1,2)))*360}deg)">${cubeSvg(2,80)}</div></div>`:''}</div>`;}
function branch(lt,D,w){const a=eo(seg(lt,.2,.6));const isR=w==='r';const f=[2,4,8];const fi=isR?0:Math.min(2,Math.floor(seg(lt,D*.45,D*.9)*3));
 return `<div class="a" style="left:90px;top:130px;width:680px;display:flex;gap:30px">
 <div class="card" style="flex:1;padding:22px;text-align:center;opacity:${isR?a:.35}"><div class="bf" style="font-size:34px;color:#e0453a">${S.refuse}</div>
  <svg width="120" height="120" viewBox="0 0 100 100" style="margin:10px auto;display:block"><rect x="20" y="10" width="6" height="85" fill="#6b4226"/><path d="M26 14 Q50 4 70 16 Q86 24 92 14 V52 Q76 62 62 52 Q46 42 26 50 Z" fill="#fdfbf0" stroke="#0d3326" stroke-width="3" transform="rotate(${isR?Math.sin(lt*5)*4:0} 26 14)"/></svg>
  <div style="font-weight:800;font-size:22px;opacity:${isR?eo(seg(lt,D*.5,D*.6)):0}">${S.over}</div></div>
 <div class="card" style="flex:1;padding:22px;text-align:center;opacity:${isR?.35:a}"><div class="bf" style="font-size:34px;color:#3fb36b">${S.accept}</div>
  <div style="height:130px;display:flex;align-items:center;justify-content:center;transform:translateX(${isR?0:(eo(seg(lt,D*.2,D*.4))*40)}px)">${cubeSvg(isR?2:f[fi],110)}</div>
  <div style="font-weight:800;font-size:26px;opacity:${isR?0:eo(seg(lt,D*.45,D*.5))}">${isR?'':f.slice(0,fi+1).join(' → ')}</div></div></div>`;}

// ---------- sous-titres
const CHUNKS=TL.map(x=>{const parts=x.txt.match(/[^.!?…]+[.!?…]+[»"]?\s*|[^.!?…]+$/g)||[x.txt];const out=[];let cur='';parts.forEach(p=>{if((cur+p).length>105&&cur){out.push(cur.trim());cur=p;}else cur+=p;});if(cur.trim())out.push(cur.trim());const tot=out.reduce((a,c)=>a+c.length,0);let acc=0;return out.map(c=>{const r={c,a:acc/tot};acc+=c.length;r.b=acc/tot;return r;});});
// confettis
const CONF=[];(function(){let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};const cols=['#ff7a59','#c9a86a','#fdfbf0','#e0c27a'];for(let i=0;i<60;i++)CONF.push({x:rnd()*1280,v:160+rnd()*200,r:rnd()*360,vr:(rnd()-.5)*500,sw:rnd()*30,ph:rnd()*6,c:cols[i%4],w:8+rnd()*10});})();
function confHtml(lt){if(lt==null||lt<0||lt>4)return '';return CONF.map(c=>{const y=-30+lt*c.v;const x=c.x+Math.sin(lt*3+c.ph)*c.sw;return `<div class="a" style="left:${x}px;top:${y}px;width:${c.w}px;height:${c.w*.5}px;background:${c.c};border-radius:2px;transform:rotate(${c.r+lt*c.vr}deg)"></div>`;}).join('');}

// ---------- rendu
const OWL_HOME={x:860,y:170,s:1};
function render(t){
 let i=0;for(let k=0;k<TL.length;k++)if(t>=TL[k].t0-0.0001)i=k;const cur=TL[i],lt=t-cur.t0,Dd=cur.d;
 const Fx={board:null,owl:null,ov:'',top:1};
 SC[cur.p](lt,Dd,Fx);
 // plateau
 const bd=$('#board');if(Fx.board){const o=Fx.board;o.lt=lt;bd.innerHTML=drawBoard(o);bd.style.opacity=o.al??1;bd.style.transform=`scale(${o.sc??1})`;}else{bd.innerHTML='';}
 // chouette
 const O=Fx.owl||OWL_HOME;const env=ENV[Math.min(ENV.length-1,Math.floor(t*30))]||0;
 let bob=Math.sin(t*2.2)*4,sy=1+env*.035,rot=0;
 if(Fx.laugh&&lt>Fx.laugh[0]&&lt<Fx.laugh[1]){bob+=-Math.abs(Math.sin(lt*14))*14;rot=Math.sin(lt*9)*4;}
 if(Fx.shake&&lt>Fx.shake[0]&&lt<Fx.shake[1]){rot=Math.sin(lt*22)*7;}
 if(Fx.clap&&lt>Fx.clap[0]&&lt<Fx.clap[1]){bob+=-Math.abs(Math.sin(lt*10))*10;}
 const ow=$('#owlw');ow.style.left=O.x+'px';ow.style.top=(O.y+bob)+'px';ow.style.zIndex=Fx.owlFront?5:1;
 $('#owl').style.transform=`scale(${O.s*(2-sy)**0*1},${O.s*sy}) rotate(${rot}deg)`;$('#owl').style.transformOrigin='50% 100%';
 const wv=O.wave||Fx.wave;let ang=0;if(wv&&lt>wv[0]&&lt<wv[1]){const e=Math.min(seg(lt,wv[0],wv[0]+.3),1-seg(lt,wv[1]-.3,wv[1]));ang=e*(52+22*Math.sin((lt-wv[0])*Math.PI*2*2));}
 if(Fx.clap&&lt>Fx.clap[0]&&lt<Fx.clap[1])ang=30+30*Math.sin(lt*20);
 $('#wing').style.transform=`rotate(${-ang}deg)`;
 const wk=O.wink||Fx.wink;const winkOn=wk&&lt>wk[0]&&lt<wk[1];const laughOn=Fx.laugh&&lt>Fx.laugh[0]&&lt<Fx.laugh[1];
 const blink=((t%4.3)>4.15);
 $('#eyeR').style.opacity=(winkOn||laughOn||blink)?1:0;$('#eyeL').style.opacity=(laughOn||blink)?1:0;
 // bulle
 const bu=$('#bubble');if(Fx.bubble&&lt>Fx.bubble.a&&lt<Fx.bubble.b){const a=seg(lt,Fx.bubble.a,Fx.bubble.a+.3);bu.textContent=Fx.bubble.t;bu.style.opacity=1;bu.style.left=(O.x+70)+'px';bu.style.top=(O.y+bob-40)+'px';bu.style.transform=`scale(${back(a)})`;}else bu.style.opacity=0;
 // overlay + confettis
 $('#ov').innerHTML=(Fx.ov||'')+confHtml(Fx.conf);
 // barre du haut
 $('#cpill').textContent=cur.ch===0||cur.ch===9?(cur.ch===0?S.ep:S.chap[9]):S.chapw+' '+cur.ch;$('#ctitle').textContent=cur.ch===0?S.chap[0]:(cur.ch===9?'':S.chap[cur.ch]);
 $('#top').style.opacity=(cur.p==='P01'||cur.p==='P46')?0:1;
 // sous-titres
 const ch=CHUNKS[i];let txt='';const u=lt/Dd;if(lt>=0&&lt<=Dd+.35){for(const c of ch)if(u>=c.a-.001)txt=c.c;}
 $('#subt').textContent=txt;$('#subt').style.opacity=txt?1:0;
 // carte chapitre (dans les silences entre chapitres)
 const nx=TL[i+1];let ca=0,chn=null;
 if(nx&&nx.ch!==cur.ch&&t>cur.t0+Dd+.15){ca=eo(seg(t,cur.t0+Dd+.15,cur.t0+Dd+.55));chn=nx.ch;}
 const pv=TL[i-1];if(pv&&pv.ch!==cur.ch&&lt<.6){ca=1-seg(lt,.15,.6);chn=cur.ch;}
 const cp=$('#chap');cp.style.opacity=ca;if(ca>0&&chn!=null){const lbl=chn===9?S.chap[9]:S.chapw+' '+chn;const ttl=chn===9?S.recap.length?'':'':S.chap[chn];
  cp.innerHTML=`<div style="text-align:center;transform:scale(${.9+.1*ca})"><div class="pill" style="font-size:20px">${lbl}</div>${chn===9?'':`<div class="big" style="font-size:68px;margin-top:18px;max-width:1000px">${ttl}</div>`}</div>`;}
 $('#prog').style.width=(t/TOTAL*100)+'%';
}
window.render=render;
</script></body></html>
